<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Chalette Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d13;
    --card: #11151d;
    --card-hi: #151a24;
    --border: #1d2430;
    --border-hi: #2c3546;
    --text: #e8ecf3;
    --muted: #8a94a6;
    --faint: #5b6577;
    --accent: #5ea1ff;
    --green: #3fd68f;
    --orange: #f0a33f;
    --pink: #ff6b9d;
    --red: #ff5c5c;
    --fire1: #ff8a3d;
    --fire2: #ff4d6d;
    --font: 'Inter', -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --disp: 'Space Grotesk', 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scrollbar-color: #232c3b var(--bg); }
  body { background: var(--bg); color: var(--text); font-family: var(--font);
    -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(94,161,255,.3); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #232c3b; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #2c3546; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  .ic { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; fill: none; flex: none; }

  header { position: sticky; top: 0; z-index: 50; background: rgba(10,13,19,.86);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border); padding: 13px 20px 12px; }
  .hrow { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; max-width: 1440px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .mark { width: 31px; height: 31px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--fire1), var(--fire2));
    box-shadow: 0 4px 16px rgba(255,92,80,.35); }
  .mark .ic { width: 17px; height: 17px; color: #fff; }
  h1 { font-family: var(--disp); font-size: 16.5px; font-weight: 700; letter-spacing: .2px; white-space: nowrap; line-height: 1.15; }
  h1 small { display: block; color: var(--faint); font-family: var(--font); font-weight: 400;
    font-size: 10.5px; letter-spacing: 0; }

  .search { position: relative; }
  .search > .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--faint); width: 13.5px; pointer-events: none; }
  input#fSearch { background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px 8px 32px; font-size: 13px; font-family: var(--font);
    width: 200px; transition: border-color .18s, background .18s; }
  input#fSearch:hover { border-color: var(--border-hi); }
  input#fSearch:focus { border-color: var(--accent); outline: none; }
  input#fSearch::placeholder { color: var(--faint); }

  select, .btn { background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 11px; font-size: 13px; font-family: var(--font);
    cursor: pointer; transition: border-color .18s, background .18s, color .18s;
    display: inline-flex; align-items: center; gap: 6px; }
  select:hover, .btn:hover { border-color: var(--border-hi); background: var(--card-hi); }
  .btn:active { transform: scale(.97); }
  .btn.on { border-color: var(--accent); color: var(--accent); background: rgba(94,161,255,.08); }

  .tabs { display: flex; gap: 7px; flex-wrap: wrap; max-width: 1440px; margin: 12px auto 0; }
  .tab { display: inline-flex; align-items: center; gap: 7px; background: var(--card);
    border: 1px solid var(--border); border-radius: 999px; padding: 6.5px 14px;
    font-size: 13px; color: var(--muted); cursor: pointer; user-select: none;
    transition: border-color .18s, background .18s, color .18s, transform .18s; }
  .tab:hover { border-color: var(--border-hi); color: var(--text); }
  .tab .cnt { font-family: var(--disp); font-weight: 600; font-size: 11px;
    background: rgba(255,255,255,.06); padding: 1.5px 7.5px; border-radius: 99px;
    font-variant-numeric: tabular-nums; }
  .tab.on { color: var(--text);
    background: linear-gradient(135deg, rgba(255,138,61,.15), rgba(255,77,109,.15));
    border-color: rgba(255,120,90,.45); }
  .tab.on .cnt { background: rgba(255,120,90,.25); }
  body.dragging .tab.droppable { border-style: dashed; border-color: var(--accent); }
  .tab.over { background: rgba(94,161,255,.22); color: var(--text); transform: scale(1.07); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; max-width: 1440px; margin: 9px auto 0; align-items: center; }
  .chips .lbl { font-size: 12px; color: var(--faint); margin-right: 2px; }
  .chip2 { display: inline-flex; align-items: center; gap: 5.5px; background: var(--card);
    border: 1px solid var(--border); border-radius: 999px; padding: 4.5px 12px;
    font-size: 12px; color: var(--muted); cursor: pointer; user-select: none;
    transition: border-color .18s, color .18s, background .18s;
    font-variant-numeric: tabular-nums; }
  .chip2 .ic { width: 12.5px; height: 12.5px; }
  .chip2:hover { border-color: var(--border-hi); color: var(--text); }
  .chip2.on { border-color: rgba(240,163,63,.6); color: var(--orange); background: rgba(240,163,63,.08); }

  main { max-width: 1440px; margin: 22px auto; padding: 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(305px, 1fr)); gap: 18px; }

  .card { position: relative; background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
    transition: transform .22s cubic-bezier(.2,.7,.3,1), border-color .22s, box-shadow .22s;
    animation: fadeUp .45s cubic-bezier(.2,.7,.3,1) both; }
  .card:hover { transform: translateY(-3px); border-color: var(--border-hi);
    box-shadow: 0 12px 32px rgba(0,0,0,.45); }
  .card.outlier::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--fire1), var(--fire2)); z-index: 2; }
  .card[draggable] { cursor: grab; }
  .card.lifting { opacity: .45; }
  .card.saved { border-color: var(--green); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .embed { position: relative; width: 100%; aspect-ratio: 4/5; background: #080b10; }
  .embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .embed .ph { position: absolute; inset: 0; display: grid; place-items: center;
    background: linear-gradient(110deg, #0b0e15 8%, #121826 18%, #0b0e15 33%);
    background-size: 200% 100%; animation: shimmer 1.5s linear infinite; }
  .embed .ph .ic { width: 30px; height: 30px; color: #2a3342; stroke-width: 1.6; }
  @keyframes shimmer { to { background-position-x: -200%; } }

  .meta { padding: 13px 15px 14px; display: flex; flex-direction: column; gap: 9px; }
  .row1 { display: flex; align-items: center; gap: 7px; font-size: 13px; flex-wrap: wrap; }
  .handle { color: #3a4456; cursor: grab; display: inline-flex; }
  .handle .ic { width: 13px; height: 13px; }
  .who { font-weight: 600; color: var(--accent); text-decoration: none; }
  .who:hover { text-decoration: underline; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 500;
    padding: 2.5px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .badge .ic { width: 10.5px; height: 10.5px; }
  .badge.bnew { color: var(--pink); border-color: rgba(255,107,157,.45); background: rgba(255,107,157,.07); }
  .badge.bhorse { color: var(--orange); border-color: rgba(240,163,63,.45); background: rgba(240,163,63,.07); }
  .badge.bbait { color: var(--accent); border-color: rgba(94,161,255,.4); background: rgba(94,161,255,.07); }
  .date { margin-left: auto; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }

  .nums { display: flex; gap: 6px; flex-wrap: wrap; }
  .num { display: inline-flex; align-items: center; gap: 5px; background: #0c0f16;
    border: 1px solid var(--border); border-radius: 9px; padding: 5px 9px;
    font-size: 11px; color: var(--muted); }
  .num .ic { width: 11.5px; height: 11.5px; }
  .num b { font-family: var(--disp); color: var(--text); font-size: 12.5px; font-weight: 600;
    font-variant-numeric: tabular-nums; }
  .num.hot { border-color: rgba(255,122,77,.35); }
  .num.hot .ic, .num.hot b { color: #ff7a4d; }
  .num.x { border-color: rgba(240,163,63,.35); }
  .num.x .ic, .num.x b { color: var(--orange); }
  .num.er .ic, .num.er b { color: var(--green); }

  .cap { color: var(--muted); font-size: 12.5px; line-height: 1.55; display: -webkit-box;
    -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .cap.open { -webkit-line-clamp: unset; }
  .cap b { color: var(--text); font-weight: 600; }
  .ai { border-left: 2px solid var(--orange); background: rgba(240,163,63,.06);
    padding: 8px 11px; border-radius: 0 10px 10px 0; font-size: 12px; line-height: 1.65;
    color: var(--muted); }
  .ai b { color: var(--orange); font-weight: 600; }
  .mine { border-left: 2px solid var(--green); background: rgba(63,214,143,.06);
    padding: 8px 11px; border-radius: 0 10px 10px 0; font-size: 12px; line-height: 1.65;
    color: var(--muted); cursor: pointer; display: -webkit-box; -webkit-line-clamp: 4;
    -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
  .mine.open { -webkit-line-clamp: unset; }
  .mine b { color: var(--green); font-weight: 600; }

  .srow { display: flex; align-items: center; gap: 7px; }
  .srow label { font-size: 12px; color: var(--faint); }
  .status { flex: 1; padding: 6px 9px; font-size: 12.5px; }
  .status.s未处理 { color: var(--muted); }
  .status.s拍摄中 { color: var(--orange); border-color: rgba(240,163,63,.5); }
  .status.s已处理 { color: var(--green); border-color: rgba(63,214,143,.5); }
  .status.s跳过 { color: var(--red); border-color: rgba(255,92,92,.5); }
  .abtn { display: inline-flex; align-items: center; gap: 5px; background: #0c0f16;
    color: var(--muted); border: 1px solid var(--border); border-radius: 9px;
    padding: 6px 10px; font-size: 11.5px; font-family: var(--font); cursor: pointer;
    text-decoration: none; transition: color .18s, border-color .18s, transform .1s; }
  .abtn .ic { width: 12px; height: 12px; }
  .abtn:hover { color: var(--accent); border-color: rgba(94,161,255,.5); }
  .abtn:active { transform: scale(.95); }

  .more { text-align: center; margin: 28px 0 44px; }
  .more button { background: var(--card); color: var(--accent); border: 1px solid var(--border);
    border-radius: 12px; padding: 11px 30px; font-size: 14px; font-family: var(--font);
    cursor: pointer; transition: border-color .18s, background .18s; }
  .more button:hover { border-color: var(--border-hi); background: var(--card-hi); }

  .empty { color: var(--faint); text-align: center; padding: 70px 0; display: flex;
    flex-direction: column; align-items: center; gap: 12px; font-size: 14px; }
  .empty .ic { width: 34px; height: 34px; stroke-width: 1.5; color: #2c3546; }

  footer { color: var(--faint); font-size: 11px; text-align: center; padding: 22px; }

  #toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--card-hi); border: 1px solid var(--border-hi); border-radius: 11px;
    padding: 11px 20px; font-size: 13px; display: none; z-index: 99; opacity: 0;
    box-shadow: 0 12px 32px rgba(0,0,0,.5); transition: opacity .2s, transform .2s; }
  #toast.show { display: block; opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></symbol>
  <symbol id="i-msg" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>

  <symbol id="i-magnet" viewBox="0 0 24 24"><path d="m6 15-4-4 6.75-6.77a7.79 7.79 0 0 1 11 11L13 22l-4-4 6.39-6.36a2.14 2.14 0 0 0-3-3L6 15"/><path d="m5 8 4 4"/><path d="m12 15 4 4"/></symbol>

  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><path d="m10 8 6 4-6 4Z"/><rect x="2" y="4" width="20" height="16" rx="3"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></symbol>

  <symbol id="i-pct" viewBox="0 0 24 24"><path d="M19 5 5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></symbol>

</svg>
<header>
  <div class="hrow">
    <div class="brand">
      <div class="mark"><svg class="ic"><use href="#i-flame"/></svg></div>
      <h1>Chalette Demo<small id="updated"></small></h1>
    </div>
    <div class="search"><svg class="ic"><use href="#i-search"/></svg>
      <input id="fSearch" placeholder="搜文案 / hashtag / 账号"></div>
    <select id="fTracker"><option value="">全部 Tracker</option></select>
    <select id="fComp"><option value="">全部 Competitor</option></select>
    <select id="fSort">
      <option value="x">按 爆款倍数 (vs 自家平均)</option>
      <option value="score">按 Viral Score</option>
      <option value="er">按 Engagement Rate</option>
      <option value="comments">按 Comments</option>
      <option value="likes">按 Likes</option>
      <option value="date">按 最新日期</option>
    </select>
    <button class="btn" id="fVideo"><svg class="ic"><use href="#i-video"/></svg>只看视频</button>

    <a class="btn" href="team.html" target="_top" title="工作台"><svg class="ic"><use href="#i-users"/></svg>工作台</a>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="chips" id="presets"></div>
  <div class="chips" id="trends"></div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none"><svg class="ic"><use href="#i-search"/></svg>没有符合条件的帖子</div>
  <div class="more" id="moreWrap" style="display:none"><button id="moreBtn">载入更多</button></div>
</main>

"tracker": "Chalette Demo 竞对", "competitor": "apple", "caption": "Tech at play.\n#ShotoniPhone by…\n\n1. Nikias M. @nikiasmolina\n2. Federica C. @fedecobe\n3. Maxime L. @f1ub\n4,6. Marina H. @pro_perleprinter\n5. Leonardo M. & Omar A. @martinessleonardo @omaramorxo\n7,8. Eleonore B. @vitamin___color", "transcript": "", "brk": "Hook类型: 展示成果\n结构: 视觉奇观展示 → 优质创作者背书 → 品牌话题引导\n为什么火: 顶级视觉冲击结合UGC标签联动，激发了普通用户的创作欲望。\n改编角度: 盘点行业高质干货并@优质同行，激发互动与转发。", "my": "很多人觉得拍出高级感的短视频必须买成千上万的专业设备，其实根本不是这样。\n\n我最近翻了很多播放量极高的高赞视频，发现那些真正能吸引观众的画面，几乎全部是用最普通的手机拍出来的。\n\n关键不在于你用什么工具，而在于你有没有发现生活里的那些小细节。\n\n比如说，早上阳光照在桌子上的那个阴影，或者下雨天窗户上的水珠，这些都是天然的素材。\n\n你不需要懂复杂的运镜，打开手机自带的相机，把镜头贴近被摄物体，或者蹲下来换个低角度，画面质感立刻就出来了。\n\n今天出门的时候，不妨用手机随手拍三段这样的小片段，试着把它们剪辑成一个五秒钟的短片。\n\n如果你也想让自己的视频更有质感，可以先点个关注，我把具体的拍摄角度整理成了一份文字版，你照着做就行。", "tags": "ShotoniPhone", "bait": false, "type": "Carousel", "likes": 241460, "comments": 1080, "er": 0.64, "followers": 38163168, "date": "2026-10-27", "url": "https://www.instagram.com/p/DfAPqVlGrTc/", "video": false, "ratio": 0, "score": 0.64, "status": "未处理", "x": 0.8}, {"id": "DdXJ5sHEjuN", "tracker": "Chalette Demo 竞对", "competitor": "apple", "caption": "Jack Davison uses iPhone 18 Pro to unlock a more intimate and honest connection with his subject, in search of something more human. \n\nSee the work as part of our global photography exhibition “What Holds Us,” exploring the search for human connection within a heavily distracted contemporary world. Through moments of touch, gaze, care, ritual, solitude, and shared experience, the artists explore presence and the ways we relate, belong, and find meaning. In New York City September 18-20. \n\n#ShotoniPhone by @jackdavisonphoto \nCommissioned by Apple", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 大师观点 → 摄影作品展示 → 线下展览引流\n为什么火: 借助顶尖摄影师背书和情感共鸣话题，瞬间提升品牌格调。\n改编角度: 结合自媒体运营痛点，展示真实案例与搞钱结果吸引同行。", "my": "你有没有发现，现在我们每天刷手机的时间越来越长，但能真正打动你的内容却越来越少。\n我最近在看一些头部博主的账号时，发现了一个特别明显的现象。那些点赞转发极高的视频，往往都不是靠多炫酷的特效，而是因为它们拍出了真正的人情味。\n比如一个优秀的创作者，他不会去追求那些光鲜亮丽却空洞的画面，而是把镜头对准生活中那些微小的瞬间。可能是深夜认真打磨文案的一个背影，可能是和粉丝交流时的一个真诚眼神，或者是在面对争议时的一点坚持。\n这些真实的细节，在这个充满各种信息干扰的时代，反而成了最稀缺的东西。因为大家每天都在看各种套路和技巧，早就审美疲劳了。\n如果你觉得最近做内容没有方向，不妨试着放下那些刻意的设计，去记录一个具体的场景，或者讲一个你真正被打动的故事。\n如果你也想做出更有温度的内容，可以关注我，我们一起聊聊怎么用心做好自媒体。", "tags": "ShotoniPhone", "bait": false, "type": "Carousel", "likes": 179199, "comments": 1088, "er": 0.47, "followers": 38163168, "date": "2026-09-16", "url": "https://www.instagram.com/p/DdXJ5sHEjuN/", "video": false, "ratio": 0, "score": 0.48, "status": "未处理", "x": 0.6}, {"id": "DfBULvfmFof", "tracker": "Chalette Demo 竞对", "competitor": "businessinsider", "caption": "One viral review changed the trajectory of Natendrea Jones's business.\n \nJones had been selling seafood platters from her South Carolina home kitchen when TikTok food reviewer Gabriel Rivera came across her listing and offered her $200 to make him whatever she wanted. After he shared her creation online, her business caught the attention of far more people than she expected.\n\nCorrespondent Kathleen Elkins reports on how Jones adapted her business, Red's Garlic Seafood @geechee_goddess, to handle the demand.\n\nFind out how one seafood platter became viral at the link in our bio.\n\n#smallbusiness #entrepreneurship #seafood #tiktok", "transcript": "How did a South Carolina caterer turn a Facebook marketplace listing into 300 overnight orders? I made $5,000 in two days. $5,000? Wow. For years, Natendria Jones used Facebook Marketplace to sell seafood platters from her home kitchen. It was a side hustle. Thank you. Until TikTok food reviewer Gabriel Rivera found one of the listings. Holy s***. He offered her $200 to make him whatever she wanted. This has to be the craziest thing I've gotten off of Facebook so far. Jones made him a pan overflung with snow crab legs, lobster, shrimp, oysters, and fixings. When Rivera posted his review, the video went viral and the response was immediate. Save my life. You saved my family, my children. I've been crying. Oh my goodness. You changed my life. I'm so happy to leave. I'm sorry. I was a fool. No, it's okay. No, it's okay. I got people from Virginia, North Carolina, Maryland coming through. Jones said it helped create 300 orders overnight and generate $50,000 in sales in the following two weeks. But the sudden interest from hundreds of customers created a new problem. Keeping up. Jones recruited family members to help and had to refund some orders she didn't have the resources to fulfill. I love these problems, Joe. I had to stop and run out and go get some more lobsters. I ran out of lobsters. She has since built more structure into the business, using pre-orders to plan inventory and scheduling pickup windows. You're going to hear from me. Okay, there's a list. Her home kitchen operation can now handle 50 to 60 orders on busy days. Next, she hopes to open a food truck with the long-term dream of running a brick and mortar restaurant. Going viral got customers' attention, but adapting her operations to meet the demand is what made this small business work. Read more small business stories like this and subscribe to the Small Business Newsletter at Business Insider.", "brk": "Hook类型: 数字承诺\n结构: 偶然爆红 → 爆单危机 → 运营升级\n为什么火: 用具体暴富数字和戏剧性转折展现了自媒体改变命运的魔力。\n改编角度: 盘点自媒体如何让普通人素人一夜爆单并实现年入百万的逆袭案例。", "my": "如果你现在做自媒体觉得自己怎么发都没有流量，不妨听听这个普通人用一条视频逆风翻盘的故事。她之前一直在网上发自己做海鲜拼盘的日常，播放量一直不高，就像大多数普通人一样，每天辛辛苦苦却没人看见。直到有一天，一个本地的美食博主刷到了她的视频，主动私信她，花两百块钱让她随便做一份招牌。结果博主把视频发到网上之后，当天晚上直接引爆了流量，几百个订单一夜之间砸过来，甚至有人从外地连夜开车赶过去买。但随之而来的问题也把她难住了，人手不够，食材短缺，差一点连老顾客都得罪了。她没有慌乱，而是立刻调整了发视频的节奏，把盲目接单改成了提前预约和定时定量，不仅稳住了口碑，还把生意越做越大。很多时候我们总觉得爆款是靠运气，但真正能接住流量的，其实是你在日常内容里打磨好的基本功。如果你也想让自己的账号被更多人看见，不妨先把每天的内容和交付流程整理好。点个关注，我们下期聊聊普通人怎么低成本开始做内容。", "tags": "smallbusiness, entrepreneurship, seafood, tiktok", "bait": false, "type": "Video", "likes": 17171, "comments": 155, "er": 0.34, "followers": 5057938, "date": "2026-10-28", "url": "https://www.instagram.com/p/DfBULvfmFof/", "video": true, "ratio": 0, "score": 0.35, "status": "未处理", "x": 3.2}, {"id": "DfAPK04DZMW", "tracker": "Chalette Demo 竞对", "competitor": "businessinsider", "caption": "Subsea cables carry data thousands of miles across oceans, but the glass fibers inside of them are extremely fragile.\n\nAt SubCom's factory in New Hampshire, workers protect the fibers with steel and copper layers, then test the cable before it heads to the ocean floor.", "transcript": "At Subcom's New Hampshire factory, machines run around the clock, unwinding thousands of miles of glass. These fibers are the core of every subsea cable. But they're extremely fragile. If they bend too much, they can snap. And the slightest scratch can massively reduce the ability for light pulses to travel down it. So quality is really important in the manufacturing process. Because once this is installed in the ocean, the expectation is this is going to run for years and we don't want to have to go out there and do any kind of repairs on it. So workers wear protective gear to keep hair or dirt from touching the fibers. This machine wraps high tensile steel wire around the cable to help protect it from damage. It's the same type of material used to suspend structures like the Golden Gate Bridge. After the steel, another layer, copper. It has to be perfectly seam welded for the entire length. The ceiling keeps water out. If there's ever a clog, even a pinhole in the copper, we have to do a repair on that immediately. This copper casing will move electricity down the cable to a device called a repeater. It's based about every 55 miles of cable. The device amplifies light pulses as they travel thousands of miles across the sea floor. Once they finish a cable, they test every inch of it inside this room, where there are over 100 pans full of finished cable weighing about 70 tons each. Once they move each tank, workers have to climb up and attach it to a crane. They submerge the cable in water and pass electricity through it to make sure there are no faults. The cable is designed to last at least 25 years. We got to make sure that once we install this, that it's going to operate for the lifetime of the network.", "brk": "Hook类型: 悬念与硬核知识揭秘\n结构: 脆弱海底光纤 → 多层钢铜防护 → 严苛耐压测试\n为什么火: 罕见的工业制造全景展示，极度解压且满足猎奇心\n改编角度: 拆解自媒体爆款幕后制作流程，展示内容工业化的严苛标准", "my": "很多人觉得爆款视频是靠运气，其实后台数据最好的内容，底层逻辑都像海底光缆一样，剥开来看，每一层都有极其严格的保护。\n\n我刚开始做自媒体的时候，也以为只要选题好就行，结果发出去的数据惨不忍睹。后来我复盘了上百个播放量破百万的账号，发现它们能持续拿到流量，靠的不是偶然，而是像工厂加工光纤那样，对每一个细节的极致控制。\n\n光纤本身非常脆弱，稍微有一点瑕疵，信号就传不出去。做自媒体也是这样，你的封面不够吸睛，前三秒不够抓人，观众划走的动作就像海底的水压一样无情。所以高赞视频的开头，都会用一层高强度的钢丝去对冲用户的审美疲劳，也就是我们说的强钩子。\n\n但这还不够，光有吸引眼球的开头还不行。光缆外面还要包裹一层严丝合缝的铜管来输送能量，这就对应着你的干货内容。如果你的方法论含糊不清，哪怕封面做得再好，用户看完也觉得是在浪费时间。\n\n最后最关键的一步是测试。海底光缆在铺设之前，要泡在水里通电测试二十五年不出故障，而我们发视频前，也要反复打磨痛点，确保每一个字都能落在观众的真实需求上。\n\n如果你现在做内容也总觉得播放量卡在瓶颈，不妨停下来检查一下自己的结构，看看是哪一层出了问题。你可以在评论区聊聊你最近的一条视频数据怎么样，我们一起找找原因。", "tags": "", "bait": false, "type": "Video", "likes": 16974, "comments": 92, "er": 0.34, "followers": 5057938, "date": "2026-10-27", "url": "https://www.instagram.com/p/DfAPK04DZMW/", "video": true, "ratio": 0, "score": 0.34, "status": "未处理", "x": 3.1}, {"id": "DdMXfEGlGaX", "tracker": "Chalette Demo 竞对", "competitor": "apple", "caption": "Stop time in its tracks. \nCommissioned by Apple. Capture the moment the way you see it with variable aperture and the versatility of Pro controls on iPhone 18 Pro. #ShotoniPhone by…\n\n1. Nicholas Alan C. @nicholasalancope\n2,4,5. Silvana T. @silvanatrevale\n3. Luis Alberto R. @luisalbertorodriguezstudio", "transcript": "", "brk": "Hook类型: 视觉奇观与极致成果展示\n结构: 震撼视觉引出主题 → 品牌背书与功能解析 → 署名致敬与行动号召\n为什么火: 顶级视觉美学结合苹果品牌势能，瞬间抓取眼球并激发对新设备的渴望\n改编角度: 结合自媒体成长痛点，用颠覆性数据或高颜值视觉差切入，引出专业工具干货", "my": "很多人拍视频总觉得设备不够好，其实真正卡住你的不是相机，而是你还没学会把镜头当成自己的眼睛。\n\n你有没有发现，同样的风景或人物，有的人拍出来满屏都是质感，而你拍出来就像流水账。问题不在于你买不起更贵的机器，而在于你没有控制好光圈和景深，没把观众的视线牢牢锁在你想表达的那个瞬间。\n\n今天教你三个立刻就能用上的专业运镜控制技巧。第一步，在拍摄静止画面时，手动锁定焦距和曝光，别让自动测光一直在那里乱跳。第二步，善用大光圈虚化杂乱的背景，让主体自然跳出来。第三步，试着放慢你的手速，运镜要稳，呼吸要匀。\n\n等你把这三点练熟了，你拍出来的视频自然就有电影感了。你平时拍摄最头疼的问题是什么，在评论区告诉我，我来帮你分析。", "tags": "ShotoniPhone", "bait": false, "type": "Carousel", "likes": 127141, "comments": 789, "er": 0.34, "followers": 38163168, "date": "2026-09-12", "url": "https://www.instagram.com/p/DdMXfEGlGaX/", "video": false, "ratio": 0, "score": 0.34, "status": "未处理", "x": 0.4}, {"id": "DdWxafdmu9v", "tracker": "Chalette Demo 竞对", "competitor": "apple", "caption": "Jimmy Chin takes iPhone 18 Pro to new heights to depict the spiritual connection between climber and pure verticality.\n\nSee the work as part of our global photography exhibition “What Holds Us,” exploring the search for human connection within a heavily distracted contemporary world. Through moments of touch, gaze, care, ritual, solitude, and shared experience, the artists explore presence and the ways we relate, belong, and find meaning. In New York City September 18-20. \n\n#ShotoniPhone by @jimmychin\nCommissioned by Apple", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 极限攀登视觉冲击 → 大师背书与哲学探讨 → 线下展览与品牌活动导流\n为什么火: 顶级极限摄影师的故事感与iPhone极致影像完美结合，引发精神共鸣\n改编角度: 结合自媒体成长故事，用你的产品记录一次极限挑战或突破舒适区的过程", "my": "很多人做自媒体总觉得设备不够好背景不够高级，其实真正打动人的从来不是这些。你看国家地理摄影师吉米琴拿着最新款手机去拍绝壁上的攀岩者，拍出来的不是参数多厉害，而是人与悬崖那种极度专注的连接感。放到我们普通人的自媒体创作里也是一样的道理，读者每天在手机上划过那么多信息，早就对那些光鲜亮丽的摆拍免疫了。他们真正想看的是有温度的真实瞬间，比如你熬夜改稿时的桌角，比如你记录真实生活时眼里的光。不用等万事俱备才开始，现在就把镜头对准你当下最真实的生活场景拍一个片段发出来试试。", "tags": "ShotoniPhone", "bait": false, "type": "Carousel", "likes": 101128, "comments": 465, "er": 0.27, "followers": 38163168, "date": "2026-09-16", "url": "https://www.instagram.com/p/DdWxafdmu9v/", "video": false, "ratio": 0, "score": 0.27, "status": "未处理", "x": 0.3}, {"id": "De94HiYDaLW", "tracker": "Chalette Demo 竞对", "competitor": "businessinsider", "caption": "From intern to CEO. \n\n@pwcus CEO Paul Griggs has spent about 30 years building his career at the company. He shared one habit that has helped shape his approach to getting ahead at work. Senior reporter @ana.altchek explores his advice and how it could help you navigate your own career.\n\n#careers #leadership #careeradvice", "transcript": "If you want to get better at climbing the corporate ladder, here's one habit that the CEO of PWC used to go from intern to the C-suite. Paul Griggs has been at PWC for roughly 30 years, and now he leads its U.S. business. His career advice hasn't changed much from the time he started. He says that you should stay curious, even when you're not being prompted. Early in his career, Griggs worked with a partner who had a habit that he still remembers. In every meeting, he would bring a notebook with him, and on one side he would write down notes, and the other side he would write down questions. Anything he didn't understand would go on that second side so he could learn about it later. Griggs says that that kind of curiosity gives workers an edge. Say two people encounter the same problem at work. One of them waits to be told what they need to know, and the other person goes and does a little bit of research on their own. When the next conversation comes around, that person that did more research is a little bit quicker, they're able to contribute more, and that's where the compounding starts. Over time, that person starts to get more responsibility, and then they get more opportunities to move up quicker. So here's today's challenge. The next time you have a meeting to go to, or a deck of slides to review, bring a notebook with you and write down all of the questions that you don't have an answer to. Then choose one of those and spend just 20 minutes researching it before you go into work the next day. Because getting ahead at work isn't just about doing what's asked of you, it's about being curious enough to learn what no one asked you to. For more tips on how to get better at work, head to Business Insider.", "brk": "Hook类型: 身份共鸣\n结构: 引入CEO经历 → 揭秘核心习惯 → 对比职场行为 → 布置行动作业\n为什么火: 借大厂CEO成长故事直击职场晋升痛点，给出了低门槛的可执行方法\n改编角度: 结合自媒体运营，分享你每天用“问题笔记本”搞懂一个爆款选题的方法", "my": "很多人总觉得自己做自媒体没起色，是没赶上好时候。其实我当年刚开始写东西的时候，也每天对着后台数据发愁。直到我观察了一个一个月涨粉十万的同行，我才发现拉开差距的不是运气，而是他们有一个特别小的习惯。\n\n这个同行每次刷别人的视频或者看行业报告的时候，手里一定拿个本子。但他不是在抄金句，他把本子分成了两半。左边记别人视频里的核心逻辑，右边专门写自己看不懂的疑问。比如为什么这个封面点击率高，为什么这段前三秒留存好。凡是不明白的地方，全部写在右边，然后一条一条去复盘。\n\n他说这叫主动好奇。很多做自媒体的人遇到数据下滑，就坐在那儿等平台给流量。但真正做得好的人，会马上停下来去研究背后的底层逻辑。下一次选题的时候，他比别人多懂了一步，内容就能切中用户的痛点。时间长了，优质内容的复利就出来了，账号自然就跑通了。\n\n所以今天你也可以试一下。下一次刷到同行爆款的时候，准备一个本子，把你脑子里冒出来的所有问号全写下来。然后挑一个最核心的问题，花二十分钟去拆解它的完播率和评论区留言。做自媒体从来不是靠盲目日更，而是靠这种不服输的好奇心去解决那些没人教你的难题。如果你也想少走点弯路，可以点个关注，我们一起把内容做好。", "tags": "careers, leadership, careeradvice", "bait": false, "type": "Video", "likes": 12801, "comments": 113, "er": 0.26, "followers": 5057938, "date": "2026-10-26", "url": "https://www.instagram.com/p/De94HiYDaLW/", "video": true, "ratio": 0, "score": 0.26, "status": "未处理", "x": 2.4}, {"id": "DefL3KcEmVL", "tracker": "Chalette Demo 竞对", "competitor": "apple", "caption": "“I see my role as being a translator and a bridge between east and west,” says Bünyamin Aydin. \n\nFor @lesbenjamins 15-year anniversary, the Turkish designer invited his community to Cappadocia’s Rose Valley to showcase his ‘From Earth to Sky’ collection up close – with a fashion show set against a vibrant backdrop of abstract hot air balloons. And no, they’re not AI.\n\n#ShotoniPhone18Pro", "transcript": "", "brk": "Hook类型: 视觉奇观与事实澄清\n结构: 名人金句 → 宏大活动展示 → 打消AI质疑\n为什么火: 绝美热气球大秀极具视觉冲击，且澄清非AI引发惊叹\n改编角度: 记录自媒体幕后真实大场面，用反直觉的真实感制造讨论度", "my": "很多人总觉得做自媒体离不开各种高大上的特效和AI工具，其实观众早就看腻了那些虚假的东西。前几天我刷到一个时尚品牌的十五周年活动，他们把整个秀场搬到了土耳其的玫瑰谷，热气球和日落全都是真实存在的自然景观。当时很多人在评论区问是不是AI生成的，主理人说了一句话特别打动我，他说自己只是一个东西方文化的翻译官和桥梁。这句话放到我们做自媒体上同样适用，千万别整天躲在屏幕后面去模仿别人的模板，或者用冰冷的AI去敷衍你的粉丝。你的真实经历，你的日常生活，甚至是你今天踩过的那些坑，才是最独特的素材。今天拍视频的时候，不妨把镜头对准你身边的真实场景，讲一个你最近刚刚经历的真实故事。先别管数据会怎么样，当你开始真诚跟观众交流的时候，你的内容就已经赢了一半了。如果你最近在选题上也卡壳了，不妨在评论区聊聊你最近最苦恼的一个创作瓶颈，我们一起来看看。", "tags": "ShotoniPhone18Pro", "bait": false, "type": "Carousel", "likes": 94035, "comments": 1347, "er": 0.25, "followers": 38163168, "date": "2026-10-14", "url": "https://www.instagram.com/p/DefL3KcEmVL/", "video": false, "ratio": 0, "score": 0.26, "status": "未处理", "x": 0.3}, {"id": "DdRhA8klE_5", "tracker": "Chalette Demo 竞对", "competitor": "apple", "caption": "Define your style. Refine the results. Commissioned by Apple. Shoot with unprecedented levels of control on iPhone 18 Pro. #ShotoniPhone by…\n\n1,3,6. Nicholas Alan C. @nicholasalancope  2,4,5. Luis Alberto R. @luisalbertorodriguezstudio", "transcript": "", "brk": "Hook类型: 展示成果\n结构: 视觉大片开场 → 抛出设备型号 → 署名专业摄影师\n为什么火: 顶级画质视觉冲击与苹果品牌背书产生强烈的品质信任感\n改编角度: 结合你擅长的自媒体赛道痛点，用极致专业成果反衬工具强大", "my": "很多人拍短视频追求设备多高级，其实你真正需要掌控的是镜头的表达节奏。\n\n我最近在研究那些播放量很高的视频，发现它们不是靠复杂的运镜，而是把每个画面的细节都抓得很死。比如你想拍一个有质感的人物特写，不要急着推镜头，先去观察光线在脸上的落点。你把主光源稍微侧过来一点，背景自然就虚化了。\n\n拍的时候，把相机的焦点锁在模特的眼睛上，曝光往下压一点点，整个画面的高级感马上就出来了。不需要多贵的灯光，把自然光用好就已经赢了一大半。\n\n如果你现在拍视频总觉得画面平庸，不妨今天试着调低一档曝光，把镜头贴近被拍摄的主体再试一次。你平时拍摄最头疼的问题是什么，在评论区告诉我，我们一条条来拆解。", "tags": "ShotoniPhone", "bait": false, "type": "Carousel", "likes": 89506, "comments": 668, "er": 0.24, "followers": 38163168, "date": "2026-09-14", "url": "https://www.instagram.com/p/DdRhA8klE_5/", "video": false, "ratio": 0, "score": 0.24, "status": "未处理", "x": 0.3}, {"id": "DdUq-rpkuGr", "tracker": "Chalette Demo 竞对", "competitor": "apple", "caption": "Historic. 🏆\n\nEmmys® #ShotoniPhone 18 Pro by Alvaro C. @alvarocdc \n\n@thematthewrhys\n\nHistoric. 🏆\n\nEmmys® #ShotoniPhone 18 Pro by Alvaro C. @alvarocdc \n\n@thematthewrhys\n\nHistoric. 🏆\n\nEmmys® #ShotoniPhone 18 Pro by Alvaro C. @alvarocdc\n\n@rheaseehorn\n\nHistoric. 🏆\n\nEmmys® #ShotoniPhone 18 Pro by Alvaro C. @alvarocdc\n\n@rheaseehorn\n\nHistoric. 🏆\n\nEmmys® #ShotoniPhone 18 Pro by Alvaro C. @alvarocdc\n\nHistoric. 🏆\n\nEmmys® #ShotoniPhone 18 Pro by Alvaro C. @alvarocdc \n\n@thematthewrhys\n\n@katiedippold \n\n@knoperiod\n\n@sdrnews\n\nHistoric. 🏆\n\nEmmys® #ShotoniPhone 18 Pro by Alvaro C. @alvarocdc \n\n@sdrnews\n\nHistoric. 🏆\n\nEmmys® #ShotoniPhone 18 Pro by Alvaro C. @alvarocdc \n \n@muraihiro\n\nHistoric. 🏆\n\nEmmys® #ShotoniPhone 18 Pro by Alvaro C. @alvarocdc", "transcript": "", "brk": "Hook类型: 权威背书\n结构: 荣誉背书 → 极致影像 → 达人联动\n为什么火: 借助艾美奖历史级热点与苹果品牌势能，实现专业级影像降维打击。\n改编角度: 结合自媒体成长故事，展示用普通手机工具做出专业级内容的逆袭案例。", "my": "很多人觉得做自媒体必须得买几万块的专业设备，不然视频根本没人看。上周我看到一个普通上班族用一部旧手机拍日常，播放量直接突破了百万。其实观众根本不在乎你用的是什么高级机器，他们在意的是你讲的故事真不真诚。你不需要等设备齐全了才开始，现在手里这台手机就是你最好的生产工具。如果你也想开始记录生活，不妨把手机拿起来先拍一段试试。", "tags": "ShotoniPhone", "bait": false, "type": "Carousel", "likes": 81188, "comments": 550, "er": 0.21, "followers": 38163168, "date": "2026-09-15", "url": "https://www.instagram.com/p/DdUq-rpkuGr/", "video": false, "ratio": 0, "score": 0.22, "status": "未处理", "x": 0.3}, {"id": "DfC7bdjgaRP", "tracker": "Chalette Demo 竞对", "competitor": "businessinsider", "caption": "A single severed undersea internet cable can take weeks and more than $1 million to repair.\n\nCrews use remotely operated vehicles and grappling hooks to retrieve damaged cables from the seafloor, then reconnect their glass fibers within microns. Many of these cuts are accidental — but not all are.\n\nHead to the link in our bio to learn why protecting undersea cables is becoming a major security concern as the world relies more on cloud computing and AI.\n\n#ocean #internet #underseacable #security #internetcable #securityrisk #bigbusiness", "transcript": "And cuts do happen. In fact, roughly 100 cables are severed accidentally every year, often by ship anchors. To repair them, the crew uses a remotely operated vehicle to find the cable. Then a grappling hook to pull it from the seafloor. On board, they reconnect the glass fibers with a machine called a fusion spicer. We remove all watches and jewelry when we're splicing to reduce the risk of breaking any fibers. The machine uses cameras to line up the two ends of fiber within microns, millions of a meter. Then it melts them together. Repairs can take weeks and cost more than a million dollars. In worse cases, a break can cut an entire country off from the internet. Like in 2022, when a volcanic eruption severed the cable connecting Tonga with the outside world. It took 18 months to restore the internet back to normal. But not all cuts are accidental. From the Baltic Sea to the Taiwan Strait, cable disruptions are raising fears that covert warfare is moving underwater. We saw another incident in the Baltic Sea, with disruption So far no recent investigation has proved that a foreign government ordered the sabotage of an undersea cable. But as the world becomes more dependent on cloud computing and AI, the cost of losing connection is rising. We now need to be thinking about the seabed and what lies there. Ensuring their security and resilience is not only a technical issue, but also a matter of national and international security. To help protect undersea cables, countries have ramped up their naval patrols. Near the Baltic Sea, Finland is testing out a detection system using a technology called DAS interrogators. These devices attach to the cable and turn it into a giant vibration sensor, capable of recognizing nearby activity. But one of the best defenses against cable cuts is simply having more cables.", "brk": "Hook类型: 痛点直击+悬念\n结构: 揭秘海底光缆断裂修复的高昂代价 → 展示极高精度的物理修复过程 → 引申到地缘政治与AI时代的安全隐患\n为什么火: 用冷知识切入大国安全叙事，把看不见的基础设施危机具象化，满足了用户的好奇心\n改编角度: 盘点AI时代那些看似普通却价值千亿的“数字大动脉”如何影响我们的日常赚钱与生活", "my": "很多人觉得自媒体爆款是靠运气，其实大错特错，真正能持续拿流量的账号，背后都有一个不为人知的断裂点。就像海底光缆每天被货轮锚钩扯断一样，你的账号只要断更几天，推荐量就会直接归零。修复一条光缆要花上百万美金，而我们找回账号权重，往往需要付出几个月的心血。但真正可怕的不是意外断更，而是你的内容架构在同行眼里早就形同虚设。很多人做内容就像把手上的金银首饰全戴上一样，堆砌一堆没用的技巧，反而让受众抓不到核心。我们做内容要像精细焊接光纤那样，把每一个画面和痛点精准对齐到微米级别。你现在要做的是立刻检查自己最近十条视频的数据，看看哪个选题的底层逻辑断了，把那个地方重新焊上。", "tags": "ocean, internet, underseacable, security, internetcable, securityrisk, bigbusiness", "bait": false, "type": "Video", "likes": 9453, "comments": 35, "er": 0.19, "followers": 5057938, "date": "2026-10-28", "url": "https://www.instagram.com/p/DfC7bdjgaRP/", "video": true, "ratio": 0, "score": 0.19, "status": "未处理", "x": 1.7}, {"id": "DfDZuQ0Fx8x", "tracker": "Chalette Demo 竞对", "competitor": "businessinsider", "caption": "Passengers on a live-aboard round-the-world cruise say they were abruptly asked to leave the ship and given only hours to disembark.\n\nVilla Vie Residences, which operates the residential cruise ship Villa Vie Od around $24 billion. And the founders aren't the only ones in line for a huge payday. Google and Amazon are each expected to own more than 5% of Anthropics. That could make each more than $75 billion. Then there's Spark Capital. Spark in 2023, the VC firm led a round that valued Anthropics at just $4.5 billion. At the time, some investors thought that price was way too high, but Spark went in anyway and kept investing. According to the filing, Spark has now invested $777 million in Anthropics across six funding rounds. Spark is the only VC firm named in the filing. It appears more than 50 times, that's because its partner sits on the board. Of course, Anthropics hasn't disclosed its expected IPO share price yet, so the exact values of these stakes is still unknown, but they're going to be a lot. For more on who's poised to cash in on Anthropics' historic IPO, head to Business Insider.", "brk": "Hook类型: 财富悬念与数字承诺\n结构: 提出IPO暴富悬念 → 揭秘创始人与巨头持仓 → 总结VC神仙投资\n为什么火: 用具体到百亿的惊人财富数字，揭秘AI巨头背后的大赢家，直击观众对暴富传奇的窥探欲。\n改编角度: 盘点国内AI大厂（如智谱、月之暗面）背后身价暴涨的创始人或早期投资人，吸引搞钱人群。", "my": "很多人觉得做自媒体能不能火全看运气，其实根本不是这样。\n\n你每天辛辛苦苦剪视频发作品，播放量却卡在几百动也不动，问题往往就出在选题的底层逻辑上。你以为只要内容做得够勤快就行，但真正能拿到大结果的人，看的从来不是表面的热闹。\n\n就像前几天我研究几个头部账号的数据，表面上看它们每一条爆款都在聊不同的热点，但拆开它们的底层结构你会发现，它们其实都在用同一套筛选用户的钩子。\n\n这套逻辑拆开其实很简单，分三步。\n\n第一步，找一个大家每天都在讨论但又说不清楚的行业现象，作为你视频前三秒的切入点。\n第二步，把这个现象翻译成你粉丝每天都会遇到的具体场景，比如做选题时的迷茫或者发不出爆款的焦虑。\n第三步，给出你可以马上拿去用的落地动作，而不是空洞的大道理。\n\n你不需要去追每一个热点，先把这三个步骤用到你的下一条视频里试试。如果你想知道具体怎么拆解，可以在评论区留个数字，我把整理好的复盘笔记发给你。", "tags": "Anthropic, AI, stockmarket, IPO, tech, investing", "bait": false, "type": "Video", "likes": 5241, "comments": 42, "er": 0.1, "followers": 5057938, "date": "2026-10-27", "url": "https://www.instagram.com/p/DfAc_SbjRQt/", "video": true, "ratio": 0, "score": 0.11, "status": "未处理", "x": 1.0}, {"id": "De-a2QECu5d", "tracker": "Chalette Demo 竞对", "competitor": "businessinsider", "caption": "Japan's conveyor-belt sushi restaurants have changed how they serve food after viral videos raised hygiene concerns. \n\nThe world's largest conveyor belt sushi restaurant is opening its first US location, but the experience may not be what American diners expect. Chief correspondent Abby Narishkin visited restaurants in Japan to see how the new ordering systems work and what questions remain about bringing the concept to the US.\n\n#sushi #Japan #foodculture #restaurants", "transcript": "Sushi-do, the world's largest conveyor belt sushi restaurant, is opening its first location in the U.S. this month. But it's not gonna look like this, with random sushi passing by up for grabs. That's because of these 2023 viral social media videos, showing people licking soy sauce bottles and touching saliva to sushi pieces as they rolled by. In response, the largest conveyor belt sushi chains in Japan changed how they served food. I'm in Japan on a three-week reporting trip, and I want to see this change for myself. Curious if it'll work in the U.S. So I biked the Sushi-do in Edo Gawa City, and as expected, there was no communal sushi carousel here. Before I could even sit down, I got a weightless number. And this place was packed on a Tuesday at lunch. Ten minutes later, I got my seat assignment and found my chair at the counter, complete with my own touchscreen for ordering. I was happy to see there still is some semblance of a conveyor belt, but it only sends food that you've already ordered right to your table. So you can't touch anyone else's food. I actually really like that one, chewy the rice and the bread shimble. I will say the screen took away some of the adventure of not knowing what you were eating. But I did get to see other people's dishes flying by, so I got a pang of jealousy or a tinge of curiosity that pushed me to copy their orders, which may have been the point of conveyor belt sushi to begin with, right? To eat with your eyes? Now let me try this booty. A little sushi. And it's not just sushi-do that implemented the change. This Choshimaru location I went to got rid of their conveyor belt completely at their counter seats. The chef just handed me my sashimi. The chainsay this new way is more sanitary and helps keep their fish fresher. On the previous carousel system, tuna for example would be polled and thrown away if it traveled more than 350 meters without being picked up. I was happy with the quality of sushi-do, especially considering the price. That's one thing I'm unsure the company will be able to bring to the U.S. Grocery prices are just higher in New York City, where the first location is set to open. I wonder if they'll be able to find fish that's as good for this cheap. And then there's the waste. Americans eat a lot and throw away a lot too. Now the company says all of its plates have an icy chip beneath them, so it can track a billion dishes annually. To better understand how much food might be ordered. I'm curious to see if those metrics are going to change with a completely new customer base. Overall, I think Americans are going to gobble up this concept. If only for the flashing lights and the gimmick of pulling your sushi off what's left of a conveyor belt.", "brk": "Hook类型: 痛点直击+悬念\n结构: 恶性事件引发行业变革 → 实地探访日本新模式 → 探讨美国市场落地挑战\n为什么火: 结合全球热门餐饮丑闻与跨文化差异，满足观众的好奇心与求知欲。\n改编角度: 盘点海外爆火的商业模式进中国后如何本土化改造，或反向操作。", "my": "很多人以为做自媒体就是天天盯着热点盲目跟风，结果花了好几天剪出来的视频播放量还是只有几十。其实你只是还没看透大号爆款底层的改款逻辑。我最近特意去拆解了几个百万粉丝账号的转型过程，发现它们根本不是在追热点，而是在重构用户的信任路径。你看那些头部创作者，在调整内容结构的时候，第一步永远是把原有的散乱选题砍掉，换成用具体场景去验证方法。就像你以前发选题总是凭感觉，觉得什么火就拍什么，但观众看完根本记不住你是谁。正确的做法是把一个大而空泛的方向，拆解成观众坐在手机前马上就能用上的三个实操步骤。先用一个真实的数据或者具体的反常识现象把注意力抓过来，接着告诉大家这个方法在不同场景里到底怎么落地，最后把可能会踩的坑提前指出来。这样产出的内容不仅完播率高，而且能实实在在地帮到看视频的人。如果你现在也觉得自己的账号卡在某个阶段不知道怎么往下走，不妨花点时间把手头最常拍的那个选题拿出来，按照这个结构重新梳理一遍。", "tags": "sushi, Japan, foodculture, restaurants", "bait": false, "type": "Video", "likes": 4571, "comments": 99, "er": 0.09, "followers": 5057938, "date": "2026-10-26", "url": "https://www.instagram.com/p/De-a2QECu5d/", "video": true, "ratio": 0, "score": 0.1, "status": "未处理", "x": 0.9}, {"id": "DfILUanD5mb", "tracker": "Chalette Demo 竞对", "competitor": "businessinsider", "caption": "The World Cup is a massive global event. This summer, the tournament brought in nearly 6 billion spectators. So why is McDonald's walking away from its partnership with FIFA?\n\nThe fast food company has been advertising with the soccer giant for 32 years, and that deal is worth an estimated $40 million per year. But even with the extensive reach of the World Cup, McDonald's determined that the exposure from the tournament didn't pay off. Chief correspondent Lara O'Reilly explains why. \n\nRead more about what this decision could mean for the future of partnerships between brands and sporting events at the link in our bio. \n\n#mcdonalds #fifa #worldcup #advertising #marketing #cmoinsider", "transcript": "McDonald's is walking away from a 32 year partnership with the FIFA World Cup. Here's why that's such big news in the marketing world. The FIFA deal was worth an estimated $40 million a year. That's a lot of Big Macs. McDonald's ran its largest ever World Cup campaign this year, featuring David Beckham and Thierry Henry. But in August, its finance chief said the effort had underperformed versus our expectations. So why do brands sponsor big events like the World Cup anyway? Well, live sports are one of the few things that still drive huge global audiences all watching together. Brands want that reach and the feel good glow of athletes' achievements. But there's a problem for marketers. Companies often struggle to prove that brand exposure delivers real business results. And this World Cup was really crowded. FIFA sold its own major deals while host cities could sell their own local sponsorship packages for the first time. And for McDonald's, the math clearly wasn't mathing. McDonald's says it's now focusing its effort on its own collection of iconic IP, not someone else's. Sports will still be part of the mix, of course, but more niche properties can offer flexibility and a brand experience that consumers remember rather than a sponsorship they simply come to expect. McDonald's FIFA exit is a sign that major brands are starting to rethink the cost, the clutter and the commercial return of some of sports' biggest events. For more marketing stories like this, check out Business Insiders, CMO Insider newsletter.", "brk": "Hook类型: 反常识\n结构: 标志性事件抛出 → 数据剖析原因 → 总结行业趋势\n为什么火: 巨头放弃32年世界杯赞助的反常识决策引发商业好奇\n改编角度: 盘点自媒体或知识博主撤出高成本无效投入的真实案例", "my": "麦当劳最近做了一个决定，彻底砍掉了合作三十二年的世界杯赞助。这件事在商业圈引起了不小的震动，因为光是每年的赞助费就高达四千万美元。他们在今年还砸了史上最大规模的营销活动，请来贝克汉姆和亨利站台。但是在财报会议上，高管坦言这次投入的实际效果根本没有达到预期。\n\n为什么像世界杯这种顶级赛事，过去一直是各大品牌抢破头都要上的？因为在注意力极度分散的今天，体育直播依然是少数能把全球观众瞬间聚在一起的超级场景。品牌想要的是这种海量曝光，还有运动员自带的光环。但问题在于，很多做市场的人心里其实都有一个痛点，就是很难向老板证明这种天价曝光到底带来了多少真金白银的业务增长。而且世界杯的赛场实在太拥挤了，除了国际足联的官方赞助，连举办城市都能拉赞助，观众早就审美疲劳了。\n\n对麦当劳来说，这笔账算下来确实不划算。他们现在的策略是收缩预算，把钱花在自己本身的品牌资产上，而不是去给别人的平台做嫁衣。\n\n这个案例其实给所有做自媒体和做内容的人提了个醒。我们总觉得追大热点才能拿到流量，但盲目跟风的结果往往是钱花出去了，粉丝看完划走，什么都没留下。真正管用的，反而是去深耕那些能带来长期价值的细分选题。如果你也想搞懂普通人怎么做内容才能真正沉淀资产，可以来看看我的主页。", "tags": "mcdonalds, fifa, worldcup, advertising, marketing, cmoinsider", "bait": false, "type": "Video", "likes": 4282, "comments": 76, "er": 0.09, "followers": 5057938, "date": "2026-10-30", "url": "https://www.instagram.com/p/DfILUanD5mb/", "video": true, "ratio": 0, "score": 0.09, "status": "未处理", "x": 0.8}, {"id": "DfHyqqdFCzy", "tracker": "Chalette Demo 竞对", "competitor": "businessinsider", "caption": "The shipbuilding industry is hiring. But if you want a job, you'll need to learn some highly specialized skills.\n\nAt Austal USA, new workers can spend four years in apprenticeship training before working on vessels like Coast Guard cutters. But blazing hot temperatures, hourly pay, and weather-related work stoppages make retention a major challenge for shipyards.\n\n#coastguard #shipbuilders #america #madeinamerica", "transcript": "If the goal is to build more ships. Well, we have to have a good workforce. That's first and foremost. So our electricians are pipe bidders, welders. Those are high demand jobs. That's Shelly Thigpen. She's overseeing the build they're starting on today, a Coast Guard cutter due in three years. But to hit that deadline, the shipyard needs 365 people. Finding enough people is one of the biggest ongoing challenges for the business. Austin USA can't just hire anyone who wants this job. For security reasons, the government only lets it hire US green card holders and citizens. I mean, US citizens can be spies too, right? We follow the requirements of our contracts to make sure that we're doing the necessary background checks. Then Austin USA has to spend four years training them as part of its apprenticeship program. This has to be very precise, but this is basically spot on. From the design to this cutting table, everything is right on them. What if it was like one millimeter off? It could be a big problem. I went down the line, it could throw bulkheads off, it could throw frames off. The rework that would cause would be many, many hours. That's why every job here takes skill and precision. I mean, if I'm off by any amount, it might leave too big of a gap that's going on too. To train just 200 apprentices, Austin USA has to spend over $3 million. And once you've invested that much, the next big challenge becomes getting them to stay in the business. And you understand why that's hard when you see workers layering up in 100 degree Alabama heat. Are you putting that sweater on? Yeah. It's so hot. Why? I'll keep the fire heating up and I'll keep burning it up. It's a hot job. It's a hot job as we've done. We are lucky to have everything under cover to where we're not in the sun, so that's better. At many American shipyards, most of this work happens outside, which makes hot days even hotter. But when it rains, sometimes work stops. Employees get paid hourly, so when the weather is bad, they're likely looking at a smaller paycheck. That's another reason there's so much turnover in this industry. Why not salary people? An hourly worker, they can get paid overtime. It's just how it's set up, really.", "brk": "Hook类型: 痛点直击\n结构: 行业缺口 → 准入门槛与高昂培训成本 → 留存困境揭秘\n为什么火: 揭秘高门槛的冷门硬核行业，展示极端工作环境引发好奇与共鸣\n改编角度: 盘点自媒体人做副业或选赛道时，那些薪资极高却极其缺人的冷门蓝海行业", "my": "很多人以为做自媒体就是拍拍视频随便聊聊，其实根本不是这么回事。\n\n我最近观察了很多做不起来的账号，发现他们都有一个共同的问题，就是把做视频想得太简单了。\n\n这就好比建一艘大船，如果你连基础的焊接和电工技术都没有，光有热情是完全不够的。\n\n很多新手上来就买最贵的设备，每天花大量时间剪辑，结果发出去播放量还是只有几十。\n\n为什么？因为你连最核心的内容定位和用户痛点都没搞懂。\n\n我见过太多创作者，辛辛苦苦拍了几个月，因为方向不对，中途只能选择放弃。\n\n这其实就跟造船厂培养一个合格的工人一样，不仅门槛高，培养周期长，还要面对各种不确定性。\n\n如果你现在做自媒体也遇到了瓶颈，不知道下一步该怎么走，建议你先停下来仔细看看我的置顶视频，里面有我整理的详细拆解步骤。", "tags": "coastguard, shipbuilders, america, madeinamerica", "bait": false, "type": "Video", "likes": 4260, "comments": 173, "er": 0.09, "followers": 5057938, "date": "2026-10-30", "url": "https://www.instagram.com/p/DfHyqqdFCzy/", "video": true, "ratio": 0, "score": 0.09, "status": "未处理", "x": 0.8}, {"id": "DfAuEHHl7Nr", "tracker": "Chalette Demo 竞对", "competitor": "businessinsider", "caption": "Sweetgreen restaurant managers are about to see some more sweet green.\n\nThe salad bowl chain said Tuesday it is rolling out a new compensation and incentive plan for the new year that would raise annual pay for managers of high-performing locations to more than $200,000.\n\n\"This sets Sweetgreen up to be in the top tier of restaurants for total compensation for general managers,\" chief operating officer Jason Cochran told Business Insider. \"Our ability to be able to attract, retain, and also inspire many of our internal team members to want to be head coaches — I think it's going to be meaningful for many years to come.\"\n\nRead more about the new incentive and compensation plan for restaurant managers at work at the link in our bio. \n\nStory by Dominick Reuter\n\n(Credit: Getty Images)", "transcript": "", "brk": "Hook类型: 数字承诺\n结构: 行业现状痛点 → 抛出高薪方案 → 领导层愿景展望\n为什么火: 突破行业天花板的20万美金高薪触动了打工人的神经。\n改编角度: 盘点自媒体同行中能拿高薪的细分岗位，吸引求职者。", "my": "很多人觉得做自媒体赚钱是一件很玄学的事情，其实不是的，你看那些大博主每天好像也没发几条视频，但人家的收入就是能翻倍。\n\n我研究了很久发现，他们不是运气好，而是把内容当成了一个漏斗。第一步，用一个痛点视频把人吸引进来 <script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const SUPA = 'https://gfkyohkjrgqsqrjomyud.supabase.co';
const ANON = 'sb_publishable_fZFWQrxioF4dbe_iERmxLw_svMcTPVK';
const STATUSES = ["未处理", "拍摄中", "已处理", "跳过"];
document.getElementById('updated').textContent = '更新于 2026-11-04 06:32 (GMT+8)';
const PAGE = 48;
let shown = PAGE;
let videoOnly = false;
let curTab = '全部';

const $ = id => document.getElementById(id);
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : String(n);
const getKey = () => ANON;  // anon key is baked in — safe, can only change status
const I = n => '<svg class="ic"><use href="#i-' + n + '"/></svg>';
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const byRec = {}; DATA.forEach(d => byRec[d.id] = d);
const TRENDS = [["shotoniphone18pro", 5], ["newtrick", 2]];
DATA.forEach(d => {
  d.days = d.date ? Math.max(0, Math.floor((Date.now() - new Date(d.date + 'T00:00:00')) / 864e5)) : null;
  d.horse = d.followers > 0 && d.followers < 50000 && ((d.x || 0) >= 2 || d.score >= 10);
});
const PRESETS = [
  { k: 'px', icon: 'trend', label: '真爆款 ×2+', f: d => (d.x || 0) >= 2 },
  { k: 'pn', icon: 'star', label: '近7天', f: d => d.days !== null && d.days <= 7 },
  { k: 'ph', icon: 'zap', label: '黑马', f: d => d.horse },
  { k: 'pb', icon: 'magnet', label: '引流帖', f: d => d.bait },
];
const presetOn = {};

function toast(msg, ok) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  t.style.borderColor = ok ? 'var(--green)' : 'var(--red)';
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
}

// filters
const comps = [...new Set(DATA.map(d => d.competitor))].sort();
comps.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = '@'+c; $('fComp').appendChild(o); });
[...new Set(DATA.map(d => d.tracker))].forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; $('fTracker').appendChild(o); });

function matchQ(d) {
  const q = ($('fSearch').value || '').trim().toLowerCase();
  return !q || (d.caption + ' ' + (d.tags || '') + ' ' + (d.transcript || '') + ' ' + (d.brk || '') + ' ' + d.competitor).toLowerCase().includes(q);
}

function basePool() {
  const t = $('fTracker').value, c = $('fComp').value;
  return DATA.filter(d => (!t || d.tracker === t) && (!c || d.competitor === c) && (!videoOnly || d.video)
    && matchQ(d) && PRESETS.every(p => !presetOn[p.k] || p.f(d)));
}

function filtered() {
  const s = $('fSort').value;
  let arr = basePool().filter(d => curTab === '全部' || d.status === curTab);
  const key = { score:'score', er:'er', comments:'comments', likes:'likes', x:'x' }[s];
  if (s === 'date') arr.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  else arr.sort((a,b) => (b[key]||0) - (a[key]||0));
  return arr;
}

let dragRec = null;

function renderTabs() {
  const pool = basePool();
  const counts = { '全部': pool.length };
  STATUSES.forEach(s => counts[s] = pool.filter(d => d.status === s).length);
  $('tabs').innerHTML = '';
  ['全部', ...STATUSES].forEach(name => {
    const el = document.createElement('div');
    el.className = 'tab' + (curTab === name ? ' on' : '') + (name !== '全部' ? ' droppable' : '');
    el.innerHTML = esc(name) + ' <span class="cnt">' + counts[name] + '</span>';
    el.onclick = () => { curTab = name; shown = PAGE; render(); };
    if (name !== '全部') {
      el.ondragover = e => { if (dragRec) { e.preventDefault(); el.classList.add('over'); } };
      el.ondragleave = () => el.classList.remove('over');
      el.ondrop = e => {
        e.preventDefault(); el.classList.remove('over');
        const d = byRec[dragRec]; dragRec = null;
        if (d && d.status !== name) setStatus(d, name);
      };
    }
    $('tabs').appendChild(el);
  });
}

const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const el = e.target, pid = el.dataset.pid;
      if (!el.querySelector('iframe')) {
        const f = document.createElement('iframe');
        f.src = 'https://www.instagram.com/p/' + pid + '/embed/';
        f.loading = 'lazy'; f.allow = 'autoplay; encrypted-media';
        el.appendChild(f);
      }
      io.unobserve(el);
    }
  });
}, { rootMargin: '400px' });

async function setStatus(d, val) {
  try {
    const r = await fetch(SUPA + '/rest/v1/posts?post_id=eq.' + encodeURIComponent(d.id), {
      method: 'PATCH',
      headers: { 'apikey': ANON, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ status: val })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    d.status = val;
    cacheStatus(d.id, val);
    toast('✓ @' + d.competitor + ' 已移到「' + val + '」', true);
  } catch (e) {
    toast('更新失败: ' + e.message + (String(e.message).includes('401') || String(e.message).includes('403') ? ' — 密钥无效?' : ''), false);
  }
  render();
}

function card(d, idx) {
  const el = document.createElement('div');
  el.className = 'card' + ((d.x || 0) >= 2 ? ' outlier' : '');
  el.style.animationDelay = Math.min(idx % PAGE, 14) * 30 + 'ms';
  el.draggable = true;
  el.ondragstart = e => {
    dragRec = d.id;
    e.dataTransfer.effectAllowed = 'move';
    el.classList.add('lifting');
    document.body.classList.add('dragging');
  };
  el.ondragend = () => {
    el.classList.remove('lifting');
    document.body.classList.remove('dragging');
    dragRec = null;
  };
  const typeIcon = d.video ? 'video' : (d.type === 'Carousel' ? 'layers' : 'image');
  const days = d.days, horse = d.horse;
  const ago = days === null ? '' : (days === 0 ? '今天' : days + '天前');
  const lines = (d.caption || '').split('\n').map(l => l.trim()).filter(Boolean);
  const hook = lines[0] || '';
  const tr = (d.transcript && d.transcript !== '(转录失败)' && d.transcript !== '(无口播内容)') ? d.transcript : '';
  el.innerHTML = `
    <div class="embed" data-pid="${d.id}"><div class="ph"><svg class="ic"><use href="#i-${typeIcon}"/></svg></div></div>
    <div class="meta">
      <div class="row1">
        <span class="handle" title="拖到上方 tab 即可归类">${I('grip')}</span>
        <a class="who" href="https://www.instagram.com/${d.competitor}/" target="_blank">@${d.competitor}</a>
        <span class="badge">${d.type || '-'}</span>
        ${days !== null && days <= 7 ? '<span class="badge bnew">' + I('star') + '新帖</span>' : ''}
        ${horse ? '<span class="badge bhorse">' + I('zap') + '黑马</span>' : ''}
        ${d.bait ? '<span class="badge bbait" title="「留言XX」引流打法 — 评论被引流放大,漏斗设计值得学">' + I('magnet') + '引流</span>' : ''}
        <span class="date" title="${d.date || ''}">${ago}</span>
      </div>
      <div class="nums">
        <span class="num hot" title="Viral Score">${I('flame')}<b>${d.score}</b></span>
        ${(d.x || 0) >= 2 ? '<span class="num x" title="是自家平均热度的多少倍">' + I('trend') + '<b>×' + d.x + '</b></span>' : ''}
        <span class="num er" title="Engagement Rate">${I('pct')}<b>${d.er}%</b></span>
        <span class="num" title="Likes">${I('heart')}<b>${d.likes > 0 ? fmt(d.likes) : '隐藏'}</b></span>
        <span class="num" title="Comments">${I('msg')}<b>${fmt(d.comments)}</b></span>
        <span class="num" title="Followers">${I('users')}<b>${fmt(d.followers)}</b></span>
      </div>
      <div class="cap" onclick="this.classList.toggle('open')"></div>
      ${d.brk ? '<div class="ai" onclick="this.classList.toggle(&quot;open&quot;)"></div>' : ''}
      ${d.my ? '<div class="mine" onclick="this.classList.toggle(&quot;open&quot;)"></div>' : ''}
      <div class="srow"><label>状态</label><select class="status btn s${d.status}"></select>
        <button class="abtn copy" title="复制完整文案">${I('copy')}文案</button>
        ${tr ? '<button class="abtn mic" title="复制视频口播逐字稿">' + I('mic') + '口播</button>' : ''}
        ${d.my ? '<button class="abtn minec" title="复制我的改写口播稿(可直接拍)">' + I('mic') + '我的稿</button>' : ''}
        <button class="abtn brief" title="复制拍摄 Brief(数据+Hook+AI拆解+我的稿+口播稿+文案)">${I('clip')}Brief</button>
        <a class="abtn" href="${d.url}" target="_blank" title="打开 Instagram 原帖">${I('ext')}</a></div>
    </div>`;
  const capEl = el.querySelector('.cap');
  const restTxt = lines.slice(1).join('\n');
  capEl.innerHTML = hook ? '<b>' + esc(hook) + '</b>' + (restTxt ? '<br>' + esc(restTxt).replace(/\n/g, '<br>') : '') : '';
  const aiEl = el.querySelector('.ai');
  if (aiEl) aiEl.innerHTML = '<b>💡 AI 拆解</b><br>' + esc(d.brk).split(String.fromCharCode(10)).join('<br>');
  const myEl = el.querySelector('.mine');
  if (myEl) myEl.innerHTML = '<b>🎬 我的版本(可直接拍)</b><br>' + esc(d.my).split(String.fromCharCode(10)).join('<br>');
  const sel = el.querySelector('.status');
  STATUSES.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o); });
  sel.value = d.status;
  sel.onchange = () => setStatus(d, sel.value);
  el.querySelector('.copy').onclick = () =>
    navigator.clipboard.writeText(d.caption || '').then(() => toast('✓ 文案已复制', true));
  const micBtn = el.querySelector('.mic');
  if (micBtn) micBtn.onclick = () =>
    navigator.clipboard.writeText(tr).then(() => toast('✓ 口播稿已复制', true));
  const mineBtn = el.querySelector('.minec');
  if (mineBtn) mineBtn.onclick = () =>
    navigator.clipboard.writeText(d.my).then(() => toast('✓ 我的改写稿已复制', true));
  el.querySelector('.brief').onclick = () => {
    const NL = String.fromCharCode(10);
    const parts = ['🎬 爆款参考 @' + d.competitor + ((d.x || 0) >= 2 ? '(自家平均 ×' + d.x + ')' : ''),
      '📊 🔥' + d.score + ' | ER ' + d.er + '% | ❤️ ' + (d.likes > 0 ? fmt(d.likes) : '隐藏') +
      ' | 💬 ' + fmt(d.comments) + ' | 👥 ' + fmt(d.followers) + (ago ? ' | ' + ago : ''),
      '🔗 ' + d.url, '✍️ Hook: ' + hook];
    if (d.brk) parts.push('——— AI 拆解 ———', d.brk);
    if (d.my) parts.push('——— 我的版本(可直接拍)———', d.my);
    if (tr) parts.push('——— 竞对原口播稿 ———', tr);
    parts.push('——— 完整文案 ———', d.caption || '');
    navigator.clipboard.writeText(parts.join(NL)).then(() => toast('✓ Brief 已复制,可直接发给拍摄/剪辑', true));
  };
  io.observe(el.querySelector('.embed'));
  return el;
}

function render() {
  renderTabs();
  const arr = filtered();
  const grid = $('grid'); grid.innerHTML = '';
  arr.slice(0, shown).forEach((d, i) => grid.appendChild(card(d, i)));
  $('empty').style.display = arr.length ? 'none' : '';
  $('moreWrap').style.display = arr.length > shown ? '' : 'none';
}


function applyStatusCache() {
  try {
    const c = JSON.parse(localStorage.getItem('st_cache') || '{}');
    Object.keys(c).forEach(rid => { const d = byRec[rid]; if (d) d.status = c[rid]; });
  } catch (e) {}
}

function cacheStatus(rid, val) {
  try {
    const c = JSON.parse(localStorage.getItem('st_cache') || '{}');
    c[rid] = val; localStorage.setItem('st_cache', JSON.stringify(c));
  } catch (e) {}
}

// live status refresh (so weekly-baked page shows current statuses)
async function refreshStatuses() {
  applyStatusCache(); render();  // last-known statuses first
  if (Date.now() - (+localStorage.getItem('st_ts') || 0) < 600000) return;  // 10-min throttle
  localStorage.setItem('st_ts', String(Date.now()));
  const fresh = {};
  try {
    const r = await fetch(SUPA + '/rest/v1/posts?select=post_id,status', { headers: { 'apikey': ANON } });
    if (!r.ok) return;
    (await r.json()).forEach(row => {
      const d = byRec[row.post_id];
      if (d) d.status = row.status || '未处理';
      if (row.status && row.status !== '未处理') fresh[row.post_id] = row.status;
    });
    localStorage.setItem('st_cache', JSON.stringify(fresh));
    render();
  } catch (e) {}
}

['fTracker','fComp','fSort'].forEach(id => $(id).onchange = () => { shown = PAGE; render(); });
$('fSearch').oninput = () => { shown = PAGE; render(); };
$('fVideo').onclick = () => { videoOnly = !videoOnly; $('fVideo').classList.toggle('on', videoOnly); shown = PAGE; render(); };
$('moreBtn').onclick = () => { shown += PAGE; render(); };

// preset quick filters
$('presets').innerHTML = '<span class="lbl">快筛</span>';
PRESETS.forEach(p => {
  const c = document.createElement('span'); c.className = 'chip2';
  c.innerHTML = I(p.icon) + esc(p.label);
  c.onclick = () => { presetOn[p.k] = !presetOn[p.k]; c.classList.toggle('on', presetOn[p.k]); shown = PAGE; render(); };
  $('presets').appendChild(c);
});

// trending hashtags among outlier posts
if (TRENDS.length) {
  $('trends').innerHTML = '<span class="lbl">爆款热词</span>';
  TRENDS.forEach(([tag, n]) => {
    const c = document.createElement('span'); c.className = 'chip2';
    c.textContent = '#' + tag + ' ' + n;
    c.onclick = () => { $('fSearch').value = $('fSearch').value === tag ? '' : tag; shown = PAGE; render(); };
    $('trends').appendChild(c);
  });
} else { $('trends').style.display = 'none'; }

render();
refreshStatuses();
</script>
</body>
</html>
