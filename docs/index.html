<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Chalette Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d13;
    --card: #11151d;
    --card-hi: #151a24;
    --border: #1d2430;
    --border-hi: #2c3546;
    --text: #e8ecf3;
    --muted: #8a94a6;
    --faint: #5b6577;
    --accent: #5ea1ff;
    --green: #3fd68f;
    --orange: #f0a33f;
    --pink: #ff6b9d;
    --red: #ff5c5c;
    --fire1: #ff8a3d;
    --fire2: #ff4d6d;
    --font: 'Inter', -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --disp: 'Space Grotesk', 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scrollbar-color: #232c3b var(--bg); }
  body { background: var(--bg); color: var(--text); font-family: var(--font);
    -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(94,161,255,.3); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #232c3b; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #2c3546; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  .ic { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; fill: none; flex: none; }

  header { position: sticky; top: 0; z-index: 50; background: rgba(10,13,19,.86);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border); padding: 13px 20px 12px; }
  .hrow { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; max-width: 1440px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .mark { width: 31px; height: 31px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--fire1), var(--fire2));
    box-shadow: 0 4px 16px rgba(255,92,80,.35); }
  .mark .ic { width: 17px; height: 17px; color: #fff; }
  h1 { font-family: var(--disp); font-size: 16.5px; font-weight: 700; letter-spacing: .2px; white-space: nowrap; line-height: 1.15; }
  h1 small { display: block; color: var(--faint); font-family: var(--font); font-weight: 400;
    font-size: 10.5px; letter-spacing: 0; }

  .search { position: relative; }
  .search > .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--faint); width: 13.5px; pointer-events: none; }
  input#fSearch { background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px 8px 32px; font-size: 13px; font-family: var(--font);
    width: 200px; transition: border-color .18s, background .18s; }
  input#fSearch:hover { border-color: var(--border-hi); }
  input#fSearch:focus { border-color: var(--accent); outline: none; }
  input#fSearch::placeholder { color: var(--faint); }

  select, .btn { background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 11px; font-size: 13px; font-family: var(--font);
    cursor: pointer; transition: border-color .18s, background .18s, color .18s;
    display: inline-flex; align-items: center; gap: 6px; }
  select:hover, .btn:hover { border-color: var(--border-hi); background: var(--card-hi); }
  .btn:active { transform: scale(.97); }
  .btn.on { border-color: var(--accent); color: var(--accent); background: rgba(94,161,255,.08); }

  .tabs { display: flex; gap: 7px; flex-wrap: wrap; max-width: 1440px; margin: 12px auto 0; }
  .tab { display: inline-flex; align-items: center; gap: 7px; background: var(--card);
    border: 1px solid var(--border); border-radius: 999px; padding: 6.5px 14px;
    font-size: 13px; color: var(--muted); cursor: pointer; user-select: none;
    transition: border-color .18s, background .18s, color .18s, transform .18s; }
  .tab:hover { border-color: var(--border-hi); color: var(--text); }
  .tab .cnt { font-family: var(--disp); font-weight: 600; font-size: 11px;
    background: rgba(255,255,255,.06); padding: 1.5px 7.5px; border-radius: 99px;
    font-variant-numeric: tabular-nums; }
  .tab.on { color: var(--text);
    background: linear-gradient(135deg, rgba(255,138,61,.15), rgba(255,77,109,.15));
    border-color: rgba(255,120,90,.45); }
  .tab.on .cnt { background: rgba(255,120,90,.25); }
  body.dragging .tab.droppable { border-style: dashed; border-color: var(--accent); }
  .tab.over { background: rgba(94,161,255,.22); color: var(--text); transform: scale(1.07); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; max-width: 1440px; margin: 9px auto 0; align-items: center; }
  .chips .lbl { font-size: 12px; color: var(--faint); margin-right: 2px; }
  .chip2 { display: inline-flex; align-items: center; gap: 5.5px; background: var(--card);
    border: 1px solid var(--border); border-radius: 999px; padding: 4.5px 12px;
    font-size: 12px; color: var(--muted); cursor: pointer; user-select: none;
    transition: border-color .18s, color .18s, background .18s;
    font-variant-numeric: tabular-nums; }
  .chip2 .ic { width: 12.5px; height: 12.5px; }
  .chip2:hover { border-color: var(--border-hi); color: var(--text); }
  .chip2.on { border-color: rgba(240,163,63,.6); color: var(--orange); background: rgba(240,163,63,.08); }

  main { max-width: 1440px; margin: 22px auto; padding: 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(305px, 1fr)); gap: 18px; }

  .card { position: relative; background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
    transition: transform .22s cubic-bezier(.2,.7,.3,1), border-color .22s, box-shadow .22s;
    animation: fadeUp .45s cubic-bezier(.2,.7,.3,1) both; }
  .card:hover { transform: translateY(-3px); border-color: var(--border-hi);
    box-shadow: 0 12px 32px rgba(0,0,0,.45); }
  .card.outlier::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--fire1), var(--fire2)); z-index: 2; }
  .card[draggable] { cursor: grab; }
  .card.lifting { opacity: .45; }
  .card.saved { border-color: var(--green); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .embed { position: relative; width: 100%; aspect-ratio: 4/5; background: #080b10; }
  .embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .embed .ph { position: absolute; inset: 0; display: grid; place-items: center;
    background: linear-gradient(110deg, #0b0e15 8%, #121826 18%, #0b0e15 33%);
    background-size: 200% 100%; animation: shimmer 1.5s linear infinite; }
  .embed .ph .ic { width: 30px; height: 30px; color: #2a3342; stroke-width: 1.6; }
  @keyframes shimmer { to { background-position-x: -200%; } }

  .meta { padding: 13px 15px 14px; display: flex; flex-direction: column; gap: 9px; }
  .row1 { display: flex; align-items: center; gap: 7px; font-size: 13px; flex-wrap: wrap; }
  .handle { color: #3a4456; cursor: grab; display: inline-flex; }
  .handle .ic { width: 13px; height: 13px; }
  .who { font-weight: 600; color: var(--accent); text-decoration: none; }
  .who:hover { text-decoration: underline; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 500;
    padding: 2.5px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .badge .ic { width: 10.5px; height: 10.5px; }
  .badge.bnew { color: var(--pink); border-color: rgba(255,107,157,.45); background: rgba(255,107,157,.07); }
  .badge.bhorse { color: var(--orange); border-color: rgba(240,163,63,.45); background: rgba(240,163,63,.07); }
  .badge.bbait { color: var(--accent); border-color: rgba(94,161,255,.4); background: rgba(94,161,255,.07); }
  .date { margin-left: auto; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }

  .nums { display: flex; gap: 6px; flex-wrap: wrap; }
  .num { display: inline-flex; align-items: center; gap: 5px; background: #0c0f16;
    border: 1px solid var(--border); border-radius: 9px; padding: 5px 9px;
    font-size: 11px; color: var(--muted); }
  .num .ic { width: 11.5px; height: 11.5px; }
  .num b { font-family: var(--disp); color: var(--text); font-size: 12.5px; font-weight: 600;
    font-variant-numeric: tabular-nums; }
  .num.hot { border-color: rgba(255,122,77,.35); }
  .num.hot .ic, .num.hot b { color: #ff7a4d; }
  .num.x { border-color: rgba(240,163,63,.35); }
  .num.x .ic, .num.x b { color: var(--orange); }
  .num.er .ic, .num.er b { color: var(--green); }

  .cap { color: var(--muted); font-size: 12.5px; line-height: 1.55; display: -webkit-box;
    -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .cap.open { -webkit-line-clamp: unset; }
  .cap b { color: var(--text); font-weight: 600; }
  .ai { border-left: 2px solid var(--orange); background: rgba(240,163,63,.06);
    padding: 8px 11px; border-radius: 0 10px 10px 0; font-size: 12px; line-height: 1.65;
    color: var(--muted); }
  .ai b { color: var(--orange); font-weight: 600; }
  .mine { border-left: 2px solid var(--green); background: rgba(63,214,143,.06);
    padding: 8px 11px; border-radius: 0 10px 10px 0; font-size: 12px; line-height: 1.65;
    color: var(--muted); cursor: pointer; display: -webkit-box; -webkit-line-clamp: 4;
    -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
  .mine.open { -webkit-line-clamp: unset; }
  .mine b { color: var(--green); font-weight: 600; }

  .srow { display: flex; align-items: center; gap: 7px; }
  .srow label { font-size: 12px; color: var(--faint); }
  .status { flex: 1; padding: 6px 9px; font-size: 12.5px; }
  .status.s未处理 { color: var(--muted); }
  .status.s拍摄中 { color: var(--orange); border-color: rgba(240,163,63,.5); }
  .status.s已处理 { color: var(--green); border-color: rgba(63,214,143,.5); }
  .status.s跳过 { color: var(--red); border-color: rgba(255,92,92,.5); }
  .abtn { display: inline-flex; align-items: center; gap: 5px; background: #0c0f16;
    color: var(--muted); border: 1px solid var(--border); border-radius: 9px;
    padding: 6px 10px; font-size: 11.5px; font-family: var(--font); cursor: pointer;
    text-decoration: none; transition: color .18s, border-color .18s, transform .1s; }
  .abtn .ic { width: 12px; height: 12px; }
  .abtn:hover { color: var(--accent); border-color: rgba(94,161,255,.5); }
  .abtn:active { transform: scale(.95); }

  .more { text-align: center; margin: 28px 0 44px; }
  .more button { background: var(--card); color: var(--accent); border: 1px solid var(--border);
    border-radius: 12px; padding: 11px 30px; font-size: 14px; font-family: var(--font);
    cursor: pointer; transition: border-color .18s, background .18s; }
  .more button:hover { border-color: var(--border-hi); background: var(--card-hi); }

  .empty { color: var(--faint); text-align: center; padding: 70px 0; display: flex;
    flex-direction: column; align-items: center; gap: 12px; font-size: 14px; }
  .empty .ic { width: 34px; height: 34px; stroke-width: 1.5; color: #2c3546; }

  footer { color: var(--faint); font-size: 11px; text-align: center; padding: 22px; }

  #toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--card-hi); border: 1px solid var(--border-hi); border-radius: 11px;
    padding: 11px 20px; font-size: 13px; display: none; z-index: 99; opacity: 0;
    box-shadow: 0 12px 32px rgba(0,0,0,.5); transition: opacity .2s, transform .2s; }
  #toast.show { display: block; opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></symbol>
  <symbol id="i-msg" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>

  <symbol id="i-magnet" viewBox="0 0 24 24"><path d="m6 15-4-4 6.75-6.77a7.79 7.79 0 0 1 11 11L13 22l-4-4 6.39-6.36a2.14 2.14 0 0 0-3-3L6 15"/><path d="m5 8 4 4"/><path d="m12 15 4 4"/></symbol>

  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><path d="m10 8 6 4-6 4Z"/><rect x="2" y="4" width="20" height="16" rx="3"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></symbol>

  <symbol id="i-pct" viewBox="0 0 24 24"><path d="M19 5 5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></symbol>

</svg>
<header>
  <div class="hrow">
    <div class="brand">
      <div class="mark"><svg class="ic"><use href="#i-flame"/></svg></div>
      <h1>Chalette Demo<small id="updated"></small></h1>
    </div>
    <div class="search"><svg class="ic"><use href="#i-search"/></svg>
      <input id="fSearch" placeholder="搜文案 / hashtag / 账号"></div>
    <select id="fTracker"><option value="">全部 Tracker</option></select>
    <select id="fComp"><option value="">全部 Competitor</option></select>
    <select id="fSort">
      <option value="x">按 爆款倍数 (vs 自家平均)</option>
      <option value="score">按 Viral Score</option>
      <option value="er">按 Engagement Rate</option>
      <option value="comments">按 Comments</option>
      <option value="likes">按 Likes</option>
      <option value="date">按 最新日期</option>
    </select>
    <button class="btn" id="fVideo"><svg class="ic"><use href="#i-video"/></svg>只看视频</button>

    <a class="btn" href="team.html" target="_top" title="工作台"><svg class="ic"><use href="#i-users"/></svg>工作台</a>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="chips" id="presets"></div>
  <div class="chips" id="trends"></div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none"><svg class="ic"><use href="#i-search"/></svg>没有符合条件的帖子</div>
  <div class="more" id="moreWrap" style="display:none"><button id="moreBtn">载入更多</button></div>
</main>

p/DfSRBeRKK-0/", "video": true, "ratio": 0, "score": 0.35, "status": "未处理", "x": 1.6}, {"id": "DfAPK04DZMW", "tracker": "Chalette Demo 竞对", "competitor": "businessinsider", "caption": "Subsea cables carry data thousands of miles across oceans, but the glass fibers inside of them are extremely fragile.\n\nAt SubCom's factory in New Hampshire, workers protect the fibers with steel and copper layers, then test the cable before it heads to the ocean floor.", "transcript": "At Subcom's New Hampshire factory, machines run around the clock, unwinding thousands of miles of glass. These fibers are the core of every subsea cable. But they're extremely fragile. If they bend too much, they can snap. And the slightest scratch can massively reduce the ability for light pulses to travel down it. So quality is really important in the manufacturing process. Because once this is installed in the ocean, the expectation is this is going to run for years and we don't want to have to go out there and do any kind of repairs on it. So workers wear protective gear to keep hair or dirt from touching the fibers. This machine wraps high tensile steel wire around the cable to help protect it from damage. It's the same type of material used to suspend structures like the Golden Gate Bridge. After the steel, another layer, copper. It has to be perfectly seam welded for the entire length. The ceiling keeps water out. If there's ever a clog, even a pinhole in the copper, we have to do a repair on that immediately. This copper casing will move electricity down the cable to a device called a repeater. It's based about every 55 miles of cable. The device amplifies light pulses as they travel thousands of miles across the sea floor. Once they finish a cable, they test every inch of it inside this room, where there are over 100 pans full of finished cable weighing about 70 tons each. Once they move each tank, workers have to climb up and attach it to a crane. They submerge the cable in water and pass electricity through it to make sure there are no faults. The cable is designed to last at least 25 years. We got to make sure that once we install this, that it's going to operate for the lifetime of the network.", "brk": "Hook类型: 悬念与硬核知识揭秘\n结构: 脆弱海底光纤 → 多层钢铜防护 → 严苛耐压测试\n为什么火: 罕见的工业制造全景展示，极度解压且满足猎奇心\n改编角度: 拆解自媒体爆款幕后制作流程，展示内容工业化的严苛标准", "my": "很多人觉得爆款视频是靠运气，其实后台数据最好的内容，底层逻辑都像海底光缆一样，剥开来看，每一层都有极其严格的保护。\n\n我刚开始做自媒体的时候，也以为只要选题好就行，结果发出去的数据惨不忍睹。后来我复盘了上百个播放量破百万的账号，发现它们能持续拿到流量，靠的不是偶然，而是像工厂加工光纤那样，对每一个细节的极致控制。\n\n光纤本身非常脆弱，稍微有一点瑕疵，信号就传不出去。做自媒体也是这样，你的封面不够吸睛，前三秒不够抓人，观众划走的动作就像海底的水压一样无情。所以高赞视频的开头，都会用一层高强度的钢丝去对冲用户的审美疲劳，也就是我们说的强钩子。\n\n但这还不够，光有吸引眼球的开头还不行。光缆外面还要包裹一层严丝合缝的铜管来输送能量，这就对应着你的干货内容。如果你的方法论含糊不清，哪怕封面做得再好，用户看完也觉得是在浪费时间。\n\n最后最关键的一步是测试。海底光缆在铺设之前，要泡在水里通电测试二十五年不出故障，而我们发视频前，也要反复打磨痛点，确保每一个字都能落在观众的真实需求上。\n\n如果你现在做内容也总觉得播放量卡在瓶颈，不妨停下来检查一下自己的结构，看看是哪一层出了问题。你可以在评论区聊聊你最近的一条视频数据怎么样，我们一起找找原因。", "tags": "", "bait": false, "type": "Video", "likes": 17025, "comments": 93, "er": 0.34, "followers": 5058069, "date": "2026-10-27", "url": "https://www.instagram.com/p/DfAPK04DZMW/", "video": true, "ratio": 0, "score": 0.34, "status": "未处理", "x": 3.8}, {"id": "DfIiXbXTrmj", "tracker": "Chalette Demo 竞对", "competitor": "starbucks", "caption": "oops, should’ve clarified that one", "transcript": "Wait, what? When you asked for a black cat, you meant this?", "brk": "Hook类型: 反常识\n结构: 视觉误导 → 抛出疑问 → 揭晓反转\n为什么火: 利用黑猫的双关谐音梗制造幽默反差，引发评论互动\n改编角度: 结合自媒体运营黑话或工具谐音梗，设计一条创意误解短片", "my": "等一下，你做自媒体发视频的时候，是不是也踩过这种字面意思的坑？\n\n上周我跟剪辑师说，帮我找个黑猫的素材垫在片头。结果你猜怎么着，他真的去网上找了一只黑色的猫咪视频放上去，还问我够不够高清。\n\n我当时就愣住了，我说的这个黑猫，是我们做账号定位时候那种冷门赛道和暗黑风格的选题啊。\n\n你看，这就是平时沟通最容易翻车的地方。你以为对方能懂你的潜台词，但实际上，大家对同一个词的理解根本不在一个频道上。\n\n所以今天做账号，千万别跟观众或者团队玩这种文字游戏。你心里想的是什么，就把步骤拆得越细越好。比如你要剪什么风格的画面，把参考链接直接甩过去，比你在那儿形容半天管用得多。\n\n如果你最近也经常因为沟通不到位导致效率很低，评论区告诉我，我们聊聊你是怎么跟团队配合的。", "tags": "", "bait": false, "type": "Video", "likes": 58506, "comments": 322, "er": 0.33, "followers": 17581956, "date": "2026-10-30", "url": "https://www.instagram.com/p/DfIiXbXTrmj/", "video": true, "ratio": 0, "score": 0.34, "status": "未处理", "x": 0.6}, {"id": "Dd1PZ3BCR97", "tracker": "Chalette Demo 竞对", "competitor": "starbucks", "caption": "@belmontcameli discovered the NEW Aerocano (and so should you)", "transcript": "It's nice actually. This might be my new order. This is new. It's like an iced americano, but it's ruffy. It is airier. Profile-wise, it's just like this is my iced americano. It's good. Yeah.", "brk": "Hook类型: 尝鲜好奇\n结构: 新品展示 → 真实口感 → 种草推荐\n为什么火: 头部品牌首发新品自带流量，真实探店反馈降低决策成本。\n改编角度: 盘点自媒体圈最新AI工具或爆款选题，分享你的第一手实测体验。", "my": "昨天我刷同行账号的时候，发现了一个特别有意思的选题技巧。\n\n很多人做账号天天绞尽脑汁想大纲，其实爆款往往就藏在那些最不起眼的细节里。比如说，同样是讲干货，把严肃的行业术语换成读者每天都在用的日常场景，完播率立马就不一样了。就像我昨天看到一个视频，它没有去讲大道理，而是直接记录了一个特别真实的小改变。\n\n具体怎么做呢。第一步，你先翻一翻后台数据，看看大家最近在评论区问得最多的小问题是什么。第二步，用一句话把这个痛点直接抛出来，不要铺垫。第三步，给出你今天就能用上的那一个具体动作。\n\n你看，把选题做轻，内容反而能走得更远。如果你最近做号也卡壳了，不妨把手头正在写的这篇稿子拿出来，按照这个思路重新顺一遍。", "tags": "", "bait": false, "type": "Video", "likes": 58383, "comments": 252, "er": 0.33, "followers": 17581956, "date": "2026-09-28", "url": "https://www.instagram.com/p/Dd1PZ3BCR97/", "video": true, "ratio": 0, "score": 0.34, "status": "未处理", "x": 0.6}, {"id": "DdMXfEGlGaX", "tracker": "Chalette Demo 竞对", "competitor": "apple", "caption": "Stop time in its tracks. \nCommissioned by Apple. Capture the moment the way you see it with variable aperture and the versatility of Pro controls on iPhone 18 Pro. #ShotoniPhone by…\n\n1. Nicholas Alan C. @nicholasalancope\n2,4,5. Silvana T. @silvanatrevale\n3. Luis Alberto R. @luisalbertorodriguezstudio", "transcript": "", "brk": "Hook类型: 视觉奇观与极致成果展示\n结构: 震撼视觉引出主题 → 品牌背书与功能解析 → 署名致敬与行动号召\n为什么火: 顶级视觉美学结合苹果品牌势能，瞬间抓取眼球并激发对新设备的渴望\n改编角度: 结合自媒体成长痛点，用颠覆性数据或高颜值视觉差切入，引出专业工具干货", "my": "很多人拍视频总觉得设备不够好，其实真正卡住你的不是相机，而是你还没学会把镜头当成自己的眼睛。\n\n你有没有发现，同样的风景或人物，有的人拍出来满屏都是质感，而你拍出来就像流水账。问题不在于你买不起更贵的机器，而在于你没有控制好光圈和景深，没把观众的视线牢牢锁在你想表达的那个瞬间。\n\n今天教你三个立刻就能用上的专业运镜控制技巧。第一步，在拍摄静止画面时，手动锁定焦距和曝光，别让自动测光一直在那里乱跳。第二步，善用大光圈虚化杂乱的背景，让主体自然跳出来。第三步，试着放慢你的手速，运镜要稳，呼吸要匀。\n\n等你把这三点练熟了，你拍出来的视频自然就有电影感了。你平时拍摄最头疼的问题是什么，在评论区告诉我，我来帮你分析。", "tags": "ShotoniPhone", "bait": false, "type": "Carousel", "likes": 127132, "comments": 789, "er": 0.33, "followers": 38192104, "date": "2026-09-12", "url": "https://www.instagram.com/p/DdMXfEGlGaX/", "video": false, "ratio": 0, "score": 0.34, "status": "未处理", "x": 0.4}, {"id": "DehMmprF4yi", "tracker": "Chalette Demo 竞对", "competitor": "starbucks", "caption": "now available under Trending in the Starbucks app", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Carousel", "likes": 57198, "comments": 417, "er": 0.33, "followers": 17581956, "date": "2026-10-15", "url": "https://www.instagram.com/p/DehMmprF4yi/", "video": false, "ratio": 0, "score": 0.33, "status": "未处理", "x": 0.6}, {"id": "DfFxCHEoyTV", "tracker": "Chalette Demo 竞对", "competitor": "starbucks", "caption": "apparently there can only be one Black Cat around here", "transcript": "No, no, no! You're gonna look me in the eye and tell me that's what a black cat looks like. Hmm?", "brk": "Hook类型: 趣味宠物/反常识\n结构: 矛盾质问 → 画面展示 → 幽默反转\n为什么火: 拟人化幽默对话搭配黑猫反差萌，精准戳中爱猫人士笑点\n改编角度: 结合自媒体从业者日常，用宠物吐槽甲方或粉丝的不合理需求", "my": "你真的以为随便写个爆款标题就能火吗。\n\n我昨天看到一个同行，粉丝跟我差不多，发了一条内容数据直接翻倍。我当时点进去一看，发现它的封面其实特别简单，就是用了一张非常日常的工作截图，配上一句大家平时最常吐槽的行业大实话。\n\n很多人总觉得做自媒体必须得去蹭那些很高大上的热点，其实真不用。你每天在电脑前熬到半夜写出来的那些干货，读者根本记不住。反而有时候是你随手拍的一句真实抱怨，更能戳中大家的心思。\n\n我今天试着把这个方法拆解了一下，整理成了一份具体的复盘文档。如果你最近也觉得账号数据上不去，不妨看看评论区，我把整理好的步骤放在那里了。", "tags": "", "bait": false, "type": "Video", "likes": 54726, "comments": 462, "er": 0.31, "followers": 17581956, "date": "2026-10-29", "url": "https://www.instagram.com/p/DfFxCHEoyTV/", "video": true, "ratio": 0, "score": 0.32, "status": "未处理", "x": 0.6}, {"id": "De9uab0qqIn", "tracker": "Chalette Demo 竞对", "competitor": "spotify", "caption": "Keeping the vibes immaculate. One run at a time with @wizkhalifa. Check out Running Mode for your next run, now on Spotify.", "transcript": "Show what up, your boy Wiz Khalifa. We're gonna put in some miles, get these runners on a running mode, on Spotify. What BPM you at? 1-6. Alright. Hey. Hey. Let me show you something. Gotta get your playlist right. Okay. I know they in running mode already. What you listening to? Wiz Khalifa. Yeah. Church on the Moon.", "brk": "Hook类型: 明星现身与强互动\n结构: 明星出镜打招呼 → 跑步场景代入 → 推荐专属功能\n为什么火: 头部明星Wiz Khalifa出镜背书，结合真实跑步场景与平台新功能，精准击中运动垂直人群。\n改编角度: 结合自媒体成长痛点，邀请行业大咖出镜推荐我们的社群或工具，打造场景化信任。", "my": "很多做自媒体的朋友天天问我，到底怎么才能找到那种能让人一口气看完的灵感。其实真不用去费劲琢磨什么高深算法。今天我就带你用最笨但也最管用的方法，看看我是怎么从日常散步里扒拉出一条爆款选题的。\n\n刚才我出门遛弯的时候，耳机里正好随机放到了一首老歌。我当时就琢磨，为什么这首歌一出来，我原本酸痛的腿瞬间就有了力气？这就是音乐或者说内容自带的节奏感。\n\n你做视频也是这个道理。很多时候播放量上不去，不是你不够努力，而是你的内容缺少一个能带着观众往前走的BPM。\n\n具体怎么做。第一步，打开你的手机备忘录，把今天让你情绪有波动的三个瞬间记下来，不管是一句吐槽还是一个画面。第二步，把这些碎片按时间顺序串起来，中间不要加那些假大空的转折。第三步，挑一句最戳人的话放在前三秒。\n\n你现在就可以去试一下，把今天看到的第一个有意思的画面拍下来，用我刚才说的方法写两句话。如果你在选题的时候卡壳了，在评论区告诉我你最近在纠结什么，我们一条条来梳理。", "tags": "", "bait": false, "type": "Video", "likes": 38952, "comments": 561, "er": 0.27, "followers": 14649354, "date": "2026-10-26", "url": "https://www.instagram.com/p/De9uab0qqIn/", "video": true, "ratio": 0, "score": 0.28, "status": "未处理", "x": 1.3}, {"id": "DdWxafdmu9v", "tracker": "Chalette Demo 竞对", "competitor": "apple", "caption": "Jimmy Chin takes iPhone 18 Pro to new heights to depict the spiritual connection between climber and pure verticality.\n\nSee the work as part of our global photography exhibition “What Holds Us,” exploring the search for human connection within a heavily distracted contemporary world. Through moments of touch, gaze, care, ritual, solitude, and shared experience, the artists explore presence and the ways we relate, belong, and find meaning. In New York City September 18-20. \n\n#ShotoniPhone by @jimmychin\nCommissioned by Apple", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 极限攀登视觉冲击 → 大师背书与哲学探讨 → 线下展览与品牌活动导流\n为什么火: 顶级极限摄影师的故事感与iPhone极致影像完美结合，引发精神共鸣\n改编角度: 结合自媒体成长故事，用你的产品记录一次极限挑战或突破舒适区的过程", "my": "很多人做自媒体总觉得设备不够好背景不够高级，其实真正打动人的从来不是这些。你看国家地理摄影师吉米琴拿着最新款手机去拍绝壁上的攀岩者，拍出来的不是参数多厉害，而是人与悬崖那种极度专注的连接感。放到我们普通人的自媒体创作里也是一样的道理，读者每天在手机上划过那么多信息，早就对那些光鲜亮丽的摆拍免疫了。他们真正想看的是有温度的真实瞬间，比如你熬夜改稿时的桌角，比如你记录真实生活时眼里的光。不用等万事俱备才开始，现在就把镜头对准你当下最真实的生活场景拍一个片段发出来试试。", "tags": "ShotoniPhone", "bait": false, "type": "Carousel", "likes": 101157, "comments": 466, "er": 0.27, "followers": 38192104, "date": "2026-09-16", "url": "https://www.instagram.com/p/DdWxafdmu9v/", "video": false, "ratio": 0, "score": 0.27, "status": "未处理", "x": 0.3}, {"id": "De94HiYDaLW", "tracker": "Chalette Demo 竞对", "competitor": "businessinsider", "caption": "From intern to CEO. \n\n@pwcus CEO Paul Griggs has spent about 30 years building his career at the company. He shared one habit that has helped shape his approach to getting ahead at work. Senior reporter @ana.altchek explores his advice and how it could help you navigate your own career.\n\n#careers #leadership #careeradvice", "transcript": "If you want to get better at climbing the corporate ladder, here's one habit that the CEO of PWC used to go from intern to the C-suite. Paul Griggs has been at PWC for roughly 30 years, and now he leads its U.S. business. His career advice hasn't changed much from the time he started. He says that you should stay curious, even when you're not being prompted. Early in his career, Griggs worked with a partner who had a habit that he still remembers. In every meeting, he would bring a notebook with him, and on one side he would write down notes, and the other side he would write down questions. Anything he didn't understand would go on that second side so he could learn about it later. Griggs says that that kind of curiosity gives workers an edge. Say two people encounter the same problem at work. One of them waits to be told what they need to know, and the other person goes and does a little bit of research on their own. When the next conversation comes around, that person that did more research is a little bit quicker, they're able to contribute more, and that's where the compounding starts. Over time, that person starts to get more responsibility, and then they get more opportunities to move up quicker. So here's today's challenge. The next time you have a meeting to go to, or a deck of slides to review, bring a notebook with you and write down all of the questions that you don't have an answer to. Then choose one of those and spend just 20 minutes researching it before you go into work the next day. Because getting ahead at work isn't just about doing what's asked of you, it's about being curious enough to learn what no one asked you to. For more tips on how to get better at work, head to Business Insider.", "brk": "Hook类型: 身份共鸣\n结构: 引入CEO经历 → 揭秘核心习惯 → 对比职场行为 → 布置行动作业\n为什么火: 借大厂CEO成长故事直击职场晋升痛点，给出了低门槛的可执行方法\n改编角度: 结合自媒体运营，分享你每天用“问题笔记本”搞懂一个爆款选题的方法", "my": "很多人总觉得自己做自媒体没起色，是没赶上好时候。其实我当年刚开始写东西的时候，也每天对着后台数据发愁。直到我观察了一个一个月涨粉十万的同行，我才发现拉开差距的不是运气，而是他们有一个特别小的习惯。\n\n这个同行每次刷别人的视频或者看行业报告的时候，手里一定拿个本子。但他不是在抄金句，他把本子分成了两半。左边记别人视频里的核心逻辑，右边专门写自己看不懂的疑问。比如为什么这个封面点击率高，为什么这段前三秒留存好。凡是不明白的地方，全部写在右边，然后一条一条去复盘。\n\n他说这叫主动好奇。很多做自媒体的人遇到数据下滑，就坐在那儿等平台给流量。但真正做得好的人，会马上停下来去研究背后的底层逻辑。下一次选题的时候，他比别人多懂了一步，内容就能切中用户的痛点。时间长了，优质内容的复利就出来了，账号自然就跑通了。\n\n所以今天你也可以试一下。下一次刷到同行爆款的时候，准备一个本子，把你脑子里冒出来的所有问号全写下来。然后挑一个最核心的问题，花二十分钟去拆解它的完播率和评论区留言。做自媒体从来不是靠盲目日更，而是靠这种不服输的好奇心去解决那些没人教你的难题。如果你也想少走点弯路，可以点个关注，我们一起把内容做好。", "tags": "careers, leadership, careeradvice", "bait": false, "type": "Video", "likes": 12801, "comments": 113, "er": 0.26, "followers": 5057938, "date": "2026-10-26", "url": "https://www.instagram.com/p/De94HiYDaLW/", "video": true, "ratio": 0, "score": 0.26, "status": "未处理", "x": 2.9}, {"id": "DefL3KcEmVL", "tracker": "Chalette Demo 竞对", "competitor": "apple", "caption": "“I see my role as being a translator and a bridge between east and west,” says Bünyamin Aydin. \n\nFor @lesbenjamins 15-year anniversary, the Turkish designer invited his community to Cappadocia’s Rose Valley to showcase his ‘From Earth to Sky’ collection up close – with a fashion show set against a vibrant backdrop of abstract hot air balloons. And no, they’re not AI.\n\n#ShotoniPhone18Pro", "transcript": "", "brk": "Hook类型: 视觉奇观与事实澄清\n结构: 名人金句 → s them together. Repairs can take weeks and cost more than a million dollars. In worse cases, a break can cut an entire country off from the internet. Like in 2022, when a volcanic eruption severed the cable connecting Tonga with the outside world. It took 18 months to restore the internet back to normal. But not all cuts are accidental. From the Baltic Sea to the Taiwan Strait, cable disruptions are raising fears that covert warfare is moving underwater. We saw another incident in the Baltic Sea, with disruption So far no recent investigation has proved that a foreign government ordered the sabotage of an undersea cable. But as the world becomes more dependent on cloud computing and AI, the cost of losing connection is rising. We now need to be thinking about the seabed and what lies there. Ensuring their security and resilience is not only a technical issue, but also a matter of national and international security. To help protect undersea cables, countries have ramped up their naval patrols. Near the Baltic Sea, Finland is testing out a detection system using a technology called DAS interrogators. These devices attach to the cable and turn it into a giant vibration sensor, capable of recognizing nearby activity. But one of the best defenses against cable cuts is simply having more cables.", "brk": "Hook类型: 痛点直击+悬念\n结构: 揭秘海底光缆断裂修复的高昂代价 → 展示极高精度的物理修复过程 → 引申到地缘政治与AI时代的安全隐患\n为什么火: 用冷知识切入大国安全叙事，把看不见的基础设施危机具象化，满足了用户的好奇心\n改编角度: 盘点AI时代那些看似普通却价值千亿的“数字大动脉”如何影响我们的日常赚钱与生活", "my": "很多人觉得自媒体爆款是靠运气，其实大错特错，真正能持续拿流量的账号，背后都有一个不为人知的断裂点。就像海底光缆每天被货轮锚钩扯断一样，你的账号只要断更几天，推荐量就会直接归零。修复一条光缆要花上百万美金，而我们找回账号权重，往往需要付出几个月的心血。但真正可怕的不是意外断更，而是你的内容架构在同行眼里早就形同虚设。很多人做内容就像把手上的金银首饰全戴上一样，堆砌一堆没用的技巧，反而让受众抓不到核心。我们做内容要像精细焊接光纤那样，把每一个画面和痛点精准对齐到微米级别。你现在要做的是立刻检查自己最近十条视频的数据，看看哪个选题的底层逻辑断了，把那个地方重新焊上。", "tags": "ocean, internet, underseacable, security, internetcable, securityrisk, bigbusiness", "bait": false, "type": "Video", "likes": 9573, "comments": 35, "er": 0.19, "followers": 5058069, "date": "2026-10-28", "url : "Stays on Airbnb now support free emergency housing — providing a home away from home for people affected by natural disasters, illness, or crisis.\n\nLearn how we’re making more stays like this possible at the link in bio.", "transcript": "Devastation like we had never seen before. You could see the waves crashing into the shore here. Airbnb offers to shelter evacuees and relief workers. Being in this space has allowed me to breathe and rest and know that I was protected and taken care of. Just as a community has come together and people band together, I think what we're seeing is the best of humanity.", "brk": "Hook类型: 痛点直击\n结构: 灾难现场视觉冲击 → 当事人情感释放 → 品牌公益价值升华\n为什么火: 用真实灾难中的温情故事展现品牌社会责任，激发极高共鸣。\n改编角度: 结合自媒体业务，讲述帮助普通创作者绝境翻盘的真实案例。", "my": "很多人觉得做自媒体难，是因为你总在盯着别人的粉丝数。你每天看谁又涨粉了谁又爆了，看完除了焦虑什么也得不到。我上周和三个做了三年内容的朋友聊了很久，他们告诉我，真正能稳定拿到结果的人，从来不靠运气。他们每天只做三件事，第一是复盘前一天数据不好的那条视频，找出观众在第几秒划走的。第二是把后台粉丝的留言全部看一遍，因为下一条视频的选题就藏在里面。第三是写完脚本后，对着镜头完整读一遍，把所有听起来像假大空的词全部划掉。你不需要每天绞尽脑汁去追什么热点，把这三个笨方法坚持一个月，你的完播率和互动率自然就上去了。如果你现在也经常卡在选题这一步，不妨在评论区留下你最近在做的领域，我们一条一条来拆解。", "tags": "", "bait": false, "type": "Video", "likes": 8126, "comments": 240, "er": 0.11, "followers": 7470950, "date": "2026-10-28", "url": "https://www.instagram.com/p/DfCwVBZJnoh/", "video": true, "ratio": 0, "score": 0.12, "status": "未处理", "x": 3.0}, {"id": "DfKiXlaDZeU", "tracker": "Chalette Demo 竞对", "competitor": "businessinsider", "caption": "A $300,000 flying car is in development. But are we ready for a future where cars take to the skies?\n\nBusiness Insider reporter Lloyd Lee looks at Alef Aeronautics' Model Zero Ultralight, how it compares with Tesla's latest Roadster demo, and the challenges that remain before flying cars become part of everyday life.\n\n#flyingcar #tesla #tech #transportation #innovation", "transcript": "", "brk": "Hook类型: 悬念与未来科技直击\n结构: 展示30万美元飞行汽车 → 对比特斯拉 → 剖析落地痛点\n为什么火: 极具视觉冲击的未来科技概念精准踩中大众对颠覆性出行的好奇心\n改编角度: 盘点自媒体运营中降本增效的AI工具并直击实操痛点进行实测拆解", "my": "花三十多万买辆能飞的车，听上去像是科幻电影里的情节，但最近真有人把这东西造出来了。\n\n很多人觉得，这不就是汽车加了个 风格总览 → 分类细节特写 → 互动引导\n为什么火: 紧跟时下设计趋势，激发用户创作灵感与自我表达欲望\n改编角度: 总结自媒体当月最火的3种视觉排版或内容风格供粉丝对号入座", "my": "很多人总觉得做自媒体没网感，其实你不是没有网感，你只是每次发视频都在凭感觉瞎拍。\n\n你今天回去，把最近播放量最高的那条视频拿出来，从头到尾看三遍。第一遍看它的前三秒是怎么留住人的，第二遍看它中间是怎么把一个道理讲清楚的，第三遍看它最后是怎么引导别人留言的。你会发现，那些播放量好的视频，根本不是因为运气好，而是它们在结构上都有一个共同的节奏。\n\n今天拍视频前，先别急着开机，把这三个关键动作在本子上过一遍，拍出来的效果绝对不一样。你现在去试试，拍完在评论区告诉我你卡在哪一步。", "tags": "CanvaTemplates, Canva", "bait": false, "type": "Carousel", "likes": 3012, "comments": 43, "er": 0.12, "followers": 2644034, "date": "2026-09-25", "url": "https://www.instagram.com/p/DdtZwbYES56/", "video": false, "ratio": 0, "score": 0.12, "status": "未处理", "x": 1.1}, {"id": "DfYKAsQKZL1", "tracker": "Chalette Demo 竞对", "competitor": "spotify", "caption": "Joy, positivity, and nostalgia. @Martingarrix talks about the emotion and vulnerability behind his latest project on Soundscapes. Pre-save his upcoming album ‘MARTY’ on Spotify.", "transcript": "I was definitely more messy but I appreciate the team for making me look less messy. This is a replica. Yo, it's Martin Garrix and this is Soundscapes. The world of Marty is joy, mostly joy. If I think of my childhood and messing around in my bedroom working on new songs, showing my friends and my family the music I'm working on, it brings back a lot of joy and positivity. I just turned 30 this year. It's a very personal album. I'm singing some of the songs and it's about all these chapters of life and basically who formed me, who shaped me. It's very surreal to be here looking back at all these memories, basically. I traveled the whole world for this album. I got to work with Arjit Singh. Incredible. I spent almost a month in India. I got to work with Aitana. She's amazing and it's my first time ever. I did a Spanish song in my life. Yeah, there's these different influences. I got to work with Eliana and she's incredible, Arabic, like very beautiful instruments. I never even heard before, but in awe of the new sounds. I really tried to blend all these different sounds, all these different genres, but still with my DNA, with the Garrick sound, with the Garrick melodies. So yeah, it's a bit of everything. I want these people to have a look inside my world, my brain. There's of course a lot of nostalgia. I'm here in my replica of my old bedroom where I used to make. I made animals. I made tremor in this setting on the rockets. There's definitely a lot of nostalgia in the album. And also, this is the first 30 years of Marty and then I can't wait for the next 30. It's Martin Garrick's and please save my new album, Marty, on Spotify.", "brk": "Hook类型: 身份共鸣\n结构: 自嘲破冰 → 创作初心 → 跨界亮点 → 情感升华\n为什么火: 顶级音乐人真诚复盘30岁人生节点与私密创作幕后。\n改编角度: 盘点你做自媒体30个节点的心路历程与幕后故事。", "my": "很多人觉得做自媒体就像在大海捞针，每天绞尽脑汁不知道发什么，其实你只是没找到那个让你心动的第一起点。\n\n我刚开始做号的时候也很乱，拍过风景，拍过日常，甚至不知道镜头该往哪里看。直到后来我开始拍自己真正热爱的东西，把以前那些废弃的草稿、深夜改过的文案拿出来重新复盘，我才找回了做内容最初的那种快乐。\n\n做自媒体不是为了迎合谁，而是把你的经历和世界观打包好，拿出来跟懂你的人聊聊天。我最近在整理过去几年的账号复盘，发现那些真正获得高赞和粉丝信任的内容，往往都藏着最私人的表达。不是套用什么万能公式，而是把你的真实想法诚实地讲出来。\n\n如果你现在也正处在迷茫期，不知道接下来的选题怎么做，不妨停下来看看你电脑里那些没发出去的视频。点个关注，我们一起把你的真实故事变成打动人的好内容。", "tags": "", "bait": false, "type": "Video", "likes": 17219, "comments": 277, "er": 0.12, "followers": 14649354, "date": "2026-11-05", "url": "https://www.instagram.com/p/DfYKAsQKZL1/", "video": true, "ratio": 0, "score": 0.12, "status": "未处理", "x": 0.5}, {"id": "DfAc_SbjRQt", "tracker": "Chalette Demo 竞对", "competitor": "businessinsider", "caption": "Anthropic's potential IPO could make some of its founders and investors incredibly rich.\n\nThe company's newly released filing reveals who owns a piece of the AI company behind Claude. One cofounder's stake could be worth around $24 billion at a $1.5 trillion valuation, and major corporate investors could also be in line for huge returns. But who's positioned to benefit the most? Chief correspondent Ben Bergman breaks down the details.\n\nRead more about who's poised to cash in on Anthropic's IPO at the link in our bio.\n\n#Anthropic #AI #stockmarket #IPO #tech #investing", "transcript": "Who stands to win big from Anthropics IPO? The company is preparing for a listing next month and it's about to make some people very very rich. But the biggest winners aren't necessarily who you'd expect. The company behind Claude could be valued at more than $1.5 trillion in a few weeks and its newly released IPO reveals who owns a piece of the company. So let's start with the founders. Anthropics has 7 of them and each one owns hundreds of millions of shares. Tom Brown, Anthropics chief compute officer, owns roughly 244 million shares. At a $1.5 trillion valuation, his stake alone could be worth around $24 billion. And the founders aren't the only ones in line for a huge payday. Google and Amazon are each expected to own more than 5% of Anthropics. That could make each more than $75 billion. Then there's Spark Capital. Spark in 2023, the VC firm led a round that valued Anthropics at just $4.5 billion. At the time, some investors thought that price was way too high, but Spark went in anyway and kept investing. According to the filing, Spark has now invested $777 million in Anthropics across six funding rounds. Spark is the only VC firm named in the filing. It appears more than 50 times, that's because its partner sits on the board. Of course, Anthropics hasn't disclosed its expected IPO share price yet, so the exact values of these stakes is still unknown, but they're going to be a lot. For more on who's poised to cash in on Anthropics' historic IPO, head to Business Insider.", "brk": "Hook类型: 财富悬念与数字承诺\n结构: 提出IPO暴富悬念 → 揭秘创始人与巨头持仓 → 总结VC神仙投资\n为什么火: 用具体到百亿的惊人财富数字，揭秘AI巨头背后的大赢家，直击观众对暴富传奇的窥探欲。\n改编角度: 盘点国内AI大厂（如智谱、月之暗面）背后身价暴涨的创始人或早期投资人，吸引搞钱人群。", "my": "很多人觉得做自媒体能不能火全看运气，其实根本不是这样。\n\n你每天辛辛苦苦剪视频发作品，播放量却卡在几百动也不动，问题往往就出在选题的底层逻辑上。你以为只要内容做得够勤快就行，但真正能拿到大结果的人，看的从来不是表面的热闹。\n\n就像前几天我研究几个头部账号的数据，表面上看它们每一条爆款都在聊不同的热点，但拆开它们的底层结构你会发现，它们其实都在用同一套筛选用户的钩子。\n\n这套逻辑拆开其实很简单，分三步。\n\n第一步，找一个大家每天都在讨论但又说不清楚的行业现象，作为你视频前三秒的切入点。\n第二步，把这个现象翻译成你粉丝每天都会遇到的具体场景，比如做选题时的迷茫或者发不出爆款的焦虑。\n第三步，给出你可以马上拿去用的落地动作，而不是空洞的大道理。\n\n你不需要去追每一个热点，先把这三个步骤用到你的下一条视频里试试。如果你想知道具体怎么拆解，可以在评论区留个数字，我把整理好的复盘笔记发给你。", "tags": "Anthropic, AI, stockmarket, IPO, tech, investing", "bait": false, "type": "Video", "likes": 5245, "comments": 42, "er": 0.1, "followers": 5058069, "date": "2026-10-27", "url": "https://www.instagram.com/p/DfAc_SbjRQt/", "video": true, "ratio": 0, "score": 0.11, "status": "未处理", "x": 1.2}, {"id": "DfHyqqdFCzy", "tracker": "Chalette Demo 竞对", "competitor": "businessinsider", "caption": "The shipbuilding industry is hiring. But if you want a job, you'll need to learn some highly specialized skills.\n\nAt Austal USA, new workers can spend four years in apprenticeship training before working on vessels like Coast Guard cutters. But blazing hot temperatures, hourly pay, and weather-related work stoppages make retention a major challenge for shipyards.\n\n#coastguard #shipbuilders #america #madeinamerica", "transcript": "If the goal is to build more ships. Well, we have to have a good workforce. That's first and foremost. So our electricians are pipe bidders, welders. Those are high demand jobs. That's Shelly Thigpen. She's overseeing the build they're starting on today, a Coast Guard cutter due in three years. But to hit that deadline, the shipyard needs 365 people. Finding enough people is one of the biggest ongoing challenges for the business. Austin USA can't just hire anyone who wants this job. For security reasons, the government only lets it hire US green card holders and citizens. I mean, US citizens can be spies too, right? We follow the requirements of our contracts to make sure that we're doing the necessary background checks. Then Austin USA has to spend four years training them as part of its apprenticeship program. This has to be very precise, but this is basically spot on. From the design to this cutting table, everything is right on them. What if it was like one millimeter off? It could be a big problem. I went down the line, it could throw bulkheads off, it could throw frames off. The rework that would cause would be many, many hours. That's why every job here takes skill and precision. I mean, if I'm off by any amount, it might leave too big of a gap that's going on too. To train just 200 apprentices, Austin USA has to spend over $3 million. And once you've invested that much, the next big challenge becomes getting them to stay in the business. And you understand why that's hard when you see workers layering up in 100 degree Alabama heat. Are you putting that sweater on? Yeah. It's so hot. Why? I'll keep the fire heating up and I'll keep burning it up. It's a hot job. It's a hot job as we've done. We are lucky to have everything under cover to where we're not in the sun, so that's better. At many American shipyards, most of this work happens outside, which makes hot days even hotter. But when it rains, sometimes work stops. Employees get paid hourly, so when the weather is bad, they're likely looking at a smaller paycheck. That's another reason there's so much turnover in this industry. Why not salary people? An hourly worker, they can get paid overtime. It's just how it's set up, really.", "brk": "Hook类型: 痛点直击\n结构: 行业缺口 → 准入门槛与高昂培训成本 → 留存困境揭秘\n为什么火: 揭秘高门槛的冷门硬核行业，展示极端工作环境引发好奇与共鸣\n改编角度: 盘点自媒体人做副业或选赛道时，那些薪资极高却极其缺人的冷门蓝海行业", "my": "很多人以为做自媒体就是拍拍视频随便聊聊，其实根本不是这么回事。\n\n我最近观察了很多做不起来的账号，发现他们都有一个共同的问题，就是把做视频想得太简单了。\n\n这就好比建一艘大船，如果你连基础的焊接和电工技术都没有，光有热情是完全不够的。\n\n很多新手上来就买最贵的设备，每天花大量时间剪辑，结果发出去播放量还是只有几十。\n\n为什么？因为你连最核心的内容定位和用户痛点都没搞懂。\n\n我见过太多创作者，辛辛苦苦拍了几个月，因为方向不对，中途只能选择放弃。\n\n这其实就跟造船厂培养一个合格的工人一样，不仅门槛高，培养周期长，还要面对各种不确定性。\n\n如果你现在做自媒体也遇到了瓶颈，不知道下一步该怎么走，建议你先停下来仔细看看我的置顶视频，里面有我整理的详细拆解步骤。", "tags": "coastguard, shipbuilders, america, madeinamerica", "bait": false, "type": "Video", "likes": 4565, "comments": 196, "er": 0.09, "followers": 5059484, "date": "2026-10-30", "url": "https://www.instagram.com/p/DfHyqqdFCzy/", "video": true, "ratio": 0, "score": 0.1, "status": "未处理", "x": 1.1}, {"id": "De-a2QECu5d", "tracker": "Chalette Demo 竞对", "competitor": "businessinsider", "caption": "Japan's conveyor-belt sushi restaurants have changed how they serve food after viral videos raised hygiene concerns. \n\nThe world's largest conveyor belt sushi restaurant is opening its first US location, but the experience may not be what American diners expect. Chief correspondent Abby Narishkin visited restaurants in Japan to see how the new ordering systems work and what questions remain about bringing the concept to the US.\n\n#sushi #Japan #foodculture #restaurants", "transcript": "Sushi-do, the world's largest conveyor belt sushi restaurant, is opening its first location in the U.S. this month. But it's not gonna look like this, with random sushi passing by up for grabs. That's because of these 2023 viral social media videos, showing people licking soy sauce bottles and touching saliva to sushi pieces as they rolled by. In response, the largest conveyor belt sushi chains in Japan changed how they served food. I'm in Japan on a three-week reporting trip, and I want to see this change for myself. Curious if it'll work in the U.S. So I biked the Sushi-do in Edo Gawa City, and as expected, there was no communal sushi carousel here. Before I could even sit down, I got a weightless number. And this place was packed on a Tuesday at lunch. Ten minutes later, I got my seat assignment and found my chair at the counter, complete with my own touchscreen for ordering. I was happy to see there still is some semblance of a conveyor belt, but it only sends food that you've already ordered right to your table. So you can't touch anyone else's food. I actually really like that one, chewy the rice and the bread shimble. I will say the screen took away some of the adventure of not knowing what you were eating. But I did get to see other people's dishes flying by, so I got a pang of jealousy or a tinge of curiosity that pushed me to copy their orders, which may have been the point of conveyor belt sushi to begin with, right? To eat with your eyes? Now let me try this booty. A little sushi. And it's not just sushi-do that implemented the change. This Choshimaru location I went to got rid of their conveyor belt completely at their counter seats. The chef just handed me my sashimi. The chainsay this new way is more sanitary and helps keep their fish fresher. On the previous carousel system, tuna for example would be polled and thrown away if it traveled more than 350 meters without being picked up. I was happy with the quality of sushi-do, especially considering the price. That's one thing I'm unsure the company will be able to bring to the U.S. Grocery prices are just higher in New York City, where the first location is set to open. I wonder if they'll be able to find fish that's as good for this cheap. And then there's the waste. Americans eat a lot and throw away a lot too. Now the company says all of its plates have an icy chip beneath them, so it can track a billion dishes annually. To better understand how much food might be ordered. I'm curious to see if those metrics are going to change with a completely new customer base. Overall, I think Americans are going to gobble up this concept. If only for the flashing lights and the gimmick of pulling your sushi off what's left of a conveyor belt.", "brk": "Hook类型: 痛点直击+悬念\n结构: 恶性事件引发行业变革 → 实地探访日本新模式 → 探讨美国市场落地挑战\n为什么火: 结合全球热门餐饮丑闻与跨文化差异，满足观众的好奇心与求知欲。\n改编角度: 盘点海外爆火的商业模式进中国后如何本土化改造，或反向操作。", "my": "很多人以为做自媒体就是天天盯着热点盲目跟风，结果花了好几天剪出来的视频播放量还是只有几十。其实你只是还没看透大号爆款底层的改款逻辑。我最近特意去拆解了几个百万粉丝账号的转型过程，发现它们根本不是在追热点，而是在重构用户的信任路径。你看那些头部创作者，在调整内容结构的时候，第一步永远是把原有的散乱选题砍掉，换成用具体场景去验证方法。就像你以前发选题总是凭感觉，觉得什么火就拍什么，但观众看完根本记不住你是谁。正确的做法是把一个大而空泛的方向，拆解成观众坐在手机前马上就能用上的三个实操步骤。先用一个真实的数据或者具体的反常识现象把注意力抓过来，接着告诉大家这个方法在不同场景里到底怎么落地，最后把可能会踩的坑提前指出来。这样产出的内容不仅完播率高，而且能实实在在地帮到看视频的人。如果你现在也觉得自己的账号卡在某个阶段不知道怎么往下走，不妨花点时间把手头最常拍的那个选题拿出来，按照这个结构重新梳理一遍。", "tags": "sushi, Japan, foodculture, restaurants", "bait": false, "type": "Video", "likes": 4587, "comments": 99, "er": 0.09, "followers": 5058069, "date": "2026-10-26", "url": "https://www.instagram.com/p/De-a2QECu5d/", "video": true, "ratio": 0, "score": 0.1, "status": "未处理", "x": 1.1}, {"id": "DdGU_qWiV7L", "tracker": "Chalette Demo 竞对", "competitor": "canva", "caption": "Don't put all your apples in one basket 🧺\n\n#CanvaDuo", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 视觉隐喻抛出观点 → 品牌标签引导互动\n为什么火: 用巧妙的视觉修辞引发职场共鸣，降低理解门槛\n改编角度: 结合自媒体运营痛点，用视觉对比讲透“不要把鸡蛋放在同一个篮子里”", "my": "做自媒体千万别把鸡蛋全放在一个篮子里。很多人拍视频习惯盯着一个平台死磕，发出去没人看就觉得是自己不行。其实问题很简单，你的内容根本没有做拆条。你辛辛苦苦拍了一条视频，其实稍微剪一下，就能同时发到好几个地方。我上周拍的那条内容，在三个平台的数据完全不一样。主平台反响平平，但在另一个地方却直接跑通了。这就是多平台分发的意义，你永远不知道哪条内容会遇到对的观众。具体怎么做呢，你只需要把长视频切成三个片段，分别提取出不同的金句和痛点，然后针对每个平台的风格稍微调整一下开头。今天回去就把你手头那条播放量最好的视频拿出来，重新剪辑两个不同长度的版本，试试看效果。如果你在剪辑的时候不知道怎么分发，可以在评论区告诉我你的困惑。", "tags": "CanvaDuo", "bait": false, "type": "Image", "likes": 2258, "comments": 85, "er": 0.09, "followers": 2639882, "date": "2026-09-10", "url": "https://www.instagram.com/p/DdGU_qWiV7L/", "video": false, "ratio": 0, "score": 0.1, "status": "未处理", "x": 0.9}, {"id": "DeySgo5Bn_M", "tracker": "Chalette Demo 竞对", "competitor": "nike", "caption": "Nike x @mumbaiindians. The stage is set 🏏", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Image", "likes": 295785, "comments": 1270, "er": 0.1, "followers": 290814529, "date": "2026-10-22", "url": "https://www.instagram.com/p/DeySgo5Bn_M/", "video": false, "ratio": 0, "score": 0.1, "status": "未处理", "x": 4.0}, {"id": "DfILUanD5mb", "tracker": "Chalette Demo 竞对", "competitor": "businessinsider", "caption": "The World Cup is a massive global event. This summer, the tournament brought in nearly 6 billion spectators. So why is McDonald's walking away from its partnership with FIFA?\n\nThe fast food company has been advertising with the soccer giant for 32 years, and that deal is worth an estimated $40 million per year. But even with the extensive reach of the World Cup, McDonald's determined that the exposure from the tournament didn't pay off. Chief correspondent Lara O'Reilly explains why. \n\nRead more about what this decision could mean for the future of partnerships between brands and sporting events at the link in our bio. \n\n#mcdonalds #fifa #worldcup #advertising #marketing #cmoinsider", "transcript": "McDonald's is walking away from a 32 year partnership with the FIFA World Cup. Here's why that's such big news in the marketing world. The FIFA deal was worth an estimated $40 million a year. That's a lot of Big Macs. McDonald's ran its largest ever World Cup campaign this year, featuring David Beckham and Thierry Henry. But in August, its finance chief said the effort had underperformed versus our expectations. So why do brands sponsor big events like the World Cup anyway? Well, live sports are one of the few things that still drive huge global audiences all watching together. Brands want that reach and the feel good glow of athletes' achievements. But there's a problem for marketers. Companies often struggle to prove that brand exposure delivers real business results. And this World Cup was really crowded. FIFA sold its own major deals while host cities could sell their own local sponsorship packages for the first time. And for McDonald's, the math clearly wasn't mathing. McDonald's says it's now focusing its effort on its own collection of iconic IP, not someone else's. Sports will still be part of the mix, of course, but more niche properties can offer flexibility and a brand experience that consumers remember rather than a sponsorship they simply come to expect. McDonald's FIFA exit is a sign that major brands are starting to rethink the cost, the clutter and the commercial return of some of sports' biggest events. For more marketing stories like this, check out Business Insiders, CMO Insider newsletter.", "brk": "Hook类型: 反常识\n结构: 标志性事件抛出 → 数据剖析原因 → 总结行业趋势\n为什么火: 巨头放弃32年世界杯赞助的反常识决策引发商业好奇\n改编角度: 盘点自媒体或知识博主撤出高成本无效投入的真实案例", "my": "麦当劳最近做了一个决定，彻底砍掉了合作三十二年的世界杯赞助。这件事在商业圈引起了不小的震动，因为光是每年的赞助费就高达四千万美元。他们在今年还砸了史上最大规模的营销活动，请来贝克汉姆和亨利站台。但是在财报会议上，高管坦言这次投入的实际效果根本没有达到预期。\n\n  身份共鸣\n结构: 名人助阵 → 品牌使命 → 行动号召\n为什么火: 结合名人效应与公益善举，激发用户的同理心与社会责任感。\n改编角度: 结合自媒体成长故事做公益或回馈粉丝，展现品牌温度以获取好感。", "my": "做自媒体最怕的不是没人看，而是你天天熬夜剪辑，却发现数据像死水一样纹丝不动。\n\n我上周和一个做了三年美食的博主聊，她差一点就放弃了。她每天花五六个小时拍视频，但粉丝就是卡在几千人上不去。后来我看了她的后台，问题其实很简单，她一直在自嗨，根本没有给观众留出参与的空间。内容不是拍给自己爽的，得让看的人觉得这事和她有关系。\n\n我们那天把她的账号重新梳理了一遍。第一步，把镜头前的自我介绍砍掉，前三秒直接抛出一个大家每天都会遇到的选题痛点。第二步，每条视频只讲一个具体的解决动作，别贪心塞太多道理。第三步，评论区置顶一个互动话题，把用户的真实情绪勾出来。\n\n改完之后的第三天，她的一条日常探店视频直接跑出了两万多赞，私信箱里全是因为看到真实体验而关注她的新粉丝。\n\n做内容从来没有什么一夜爆红的捷径，无非是把每一个看你视频的人当成坐在对面喝咖啡的朋友。你想听听具体怎么调整账号定位吗，在评论区留个你的账号方向，我抽空帮你看看。", "tags": "", "bait": false, "type": "Carousel", "likes": 5478, "comments": 96, "er": 0.07, "followers": 7470950, "date": "2026-10-31", "url": "https://www.instagram.com/p/DfK330_FA0E/", "video": false, "ratio": 0, "score": 0.08, "status": "未处理", "x": 2.0}, {"id": "De_50Q1xJlP", "tracker": "Chalette Demo 竞对", "competitor": "spotify", "caption": "A voice, a sound, an album that could only be Amy Winehouse 🥀 Revisit 20 years of ‘Back to Black’ with an exclusive “You Know I’m No Good” video, only on Spotify.", "transcript": "I cheated myself Like I knew Anya do", "brk": "Hook类型: 身份共鸣\n结构: 经典怀念 → 独家内容展示 → 平台独占引导\n为什么火: 借助传奇歌手的情怀杀与平台独家稀缺内容精准吸引核心乐迷\n改编角度: 结合自媒体成长史中的标志性事件或经典案例推出平台独家复盘内容", "my": "我曾经为了找网感，把全网粉过十万的自媒体账号拆了个底朝天，结果你猜怎么着，我把自己给骗了。\n\n我当时觉得，只要天天盯着别人的数据，模仿他们的选题，粉丝就一定会涨起来。每天花三小时刷同行，看着别人点赞过万，心里急得不行，总觉得自己也快成了。但实际上呢，我的播放量还是卡在两百，连个水花都激不起来。\n\n其实问题就出在，你一直在看别人的热闹，却忘了看看自己手里到底有什么。你总觉得是文案不够炸，或者封面不够吸睛，但真正让内容崩盘的，是你根本没有建立自己的内核。\n\n今天回去把你的后台打开，别去看那些爆款数据了。挑一篇你觉得最真诚、哪怕阅读量最低的文章，重新读一遍，找找你当初写它时的那个直觉。如果你也正在被数据焦虑折磨，在评论区告诉我，我们聊聊怎么找回自己的节奏。", "tags": "", "bait": false, "type": "Video", "likes": 11341, "comments": 46, "er": 0.08, "followers": 14649354, "date": "2026-10-27", "url": "https://www.instagram.com/p/De_50Q1xJlP/", "video": true, "ratio": 0, "score": 0.08, "status": "未处理", "x": 0.4}, {"id": "DfU7oZOAvdk", "tracker": "Chalette Demo 竞对", "competitor": "businessinsider", "caption": "In Japan, vending machines are a staple of city streets and rake in over $30 billion a year. But they may not be on every street corner for much longer. \n\nIn December last year, Coca-Cola Bottlers Japan reported over half a billion dollars in impairment losses, with vending machines being a major factor. And in March, the beverage company DyDo said it was removing 20,000 unprofitable machines. Chief correspondent Abby Narishkin takes a look at why in the latest episode of \"Big Business.\"\n\n#japan #vendingmachines #snacks #softdrinks #bigbusiness", "transcript": "Vending machines are everywhere in Japan. Every single corner. But Japan's quintessential vending machines are struggling. The country has millions of them, and they rake in over $30 billion a year. In December 2025, Coca-Cola Bottleers Japan reported over half a billion dollars in impairment losses, mostly because of its vending machines. In March, Ditto, one of the largest beverage companies, said it was removing 20,000 unprofitable machines. So why is this all happening? Well, companies used to be able to sell these bottles for really cheap, but because of inflation, it got a lot more expensive, sometimes 50% more. Now, these machines can't compete with convenience stores. 7-Eleven can sell its own private label for cheaper. Like this was 110 yen, and this giant bottle I got at Lawson's convenience store was also 110. The other reason is labor costs. These take a lot of maintenance, and someone has to restock them. But because Japan's population is shrinking and getting older, there's less workers to do it. In the last decade, there's been a 20% drop in the number of vending machines selling drinks. But it's not just a convenient beverage that's at risk. These machines are also a part of Japan's disaster response system. If there were an earthquake, many will start dispensing free drinks. And not to mention, this is an institution here. Back in the 70s, Japan invented the technology for a machine to sell both hot and cold drinks. This is the coolest vending machine I've found so nts for total compensation for general managers,\" chief operating officer Jason Cochran told Business Insider. \"Our ability to be able to attract, retain, and also inspire many of our internal team members to want to be head coaches — I think it's going to be meaningful for many years to come.\"\n\nRead more about the new incentive and compensation plan for restaurant managers at work at the link in our bio. \n\nStory by Dominick Reuter\n\n(Credit: Getty Images)", "transcript": "", "brk": "Hook类型: 数字承诺\n结构: 行业现状痛点 → 抛出高薪方案 → 领导层愿景展望\n为什么火: 突破行业天花板的20万美金高薪触动了打工人的神经。\n改编角度: 盘点自媒体同行中能拿高薪的细分岗位，吸引求职者。", "my": "很多人觉得做自媒体赚钱是一件很玄学的事情，其实不是的，你看那些大博主每天好像也没发几条视频，但人家的收入就是能翻倍。\n\n我研究了很久发现，他们不是运气好，而是把内容当成了一个漏斗。第一步，用一个痛点视频把人吸引进来，别讲虚的，就讲大家每天最头疼的选题怎么找。第二步，用干货建立信任，告诉大家怎么写大纲。最后一步，把流量引导到私域或者橱窗里去转化。\n\n你看，方法其实就这么简单，难的是你每天能不能坚持去打磨这三个步骤。如果你现在做账号还没有找到方向，不用急着去学那些复杂的技巧，先把每天的内容质量抓起来。你觉得最难的是哪一步，我们评论区聊聊。", "tags": "", "bait": false, "type": "Image", "likes": 3118, "comments": 78, "er": 0.06, "followers": 5058069, "date": "2026-10-27", "url": "https://www.instagram.com/p/DfAuEHHl7Nr/", "video": false, "ratio": 0, "score": 0.07, "status": "未处理", "x": 0.8}, {"id": "DfYURLpKQc9", "tracker": "Chalette Demo 竞对", "competitor": "spotify", "caption": "@starglow_bmsg unpacked how fashion and music make their performances so electric on the #CoachxSpotify Tabby Tour stop in Tokyo ✨\n\nListen to their new single, “Slam Dunk,” now on Spotify", "transcript": "こんにちはスターグローです スターグローについてしておいた方がいいということを教えしますはいステージの衣装はめちゃくちゃ自分たちの本番のモチベーションにつながってきていると思いますし自分たちを表現する上で隠せないものだと思います はい自分が18歳の頃の自分に伝えたいことはですねあの友達とたくさん遊べ はい僕はだまはリンキンパークさんの音楽以外でどんな風に自己表現しているかは僕は俳優活動を頑張りたいと思っているので僕はロックが好きなのでロックビートの曲とかやっぱりヘビーなサウンドのジャンだったりとかギターはすごい好きなのであのそれを聞くとすごい興奮して自分の愛幻を勝ちさんを感動きますはいそうですね 発見はまあでもやっぱり自分たちはアーティストなのでその新しい刺激だったり発見をまあパフォーマンスだったり自分自身のリリックになったりだとかしてアーティストとして生かせているかなと思います 以上スタイルでしたありがとうございました", "brk": "Hook类型: 身份共鸣\n结构: 嘉宾打招呼 → 分享穿搭与音乐关系 → 给出年轻时的建议 → 谈及除音乐外的自我表现 → 总结对艺术创作的启发\n为什么火: 利用当红艺人的独家访谈与粉丝对偶像的情感连接，结合时尚与音乐跨界话题迅速抓人眼球。\n改编角度: 结合自媒体成长或创作痛点，邀请圈内达人分享“副业/创作灵感来源”与“年轻时的避坑建议”。", "my": "很多做自媒体的朋友总觉得灵感枯竭，其实是你每天把自己关在房间里刷手机，根本没有吸收外界的新鲜养分。我以前也这样，直到我开始强迫自己每周去做三件事。第一件，放下手机去坐一趟没有目的地的公交车，看路边的人在做什么。第二件，去菜市场或者旧货市场，观察那些真实生活着的普通人。第三件，把这些画面随时随地记录在备忘录里。你会发现你的选题库再也不会空了，因为最好的内容从来不是坐在桌前想出来的，而是你走出去撞出来的。如果你今天刚好也觉得写不出东西，不妨现在就把手机放下，出门走十分钟试试看。", "tags": "CoachxSpotify", "bait": false, "type": "Video", "likes": 9964, "comments": 124, "er": 0.07, "followers": 14649354, "date": "2026-11-06", "url": "https://www.instagram.com/p/DfYURLpKQc9/", "video": true, "ratio": 0, "score": 0.07, "status": "未处理", "x": 0.3}, {"id": "DfYIq40F9Z5", "tracker": "Chalette Demo 竞对", "competitor": "businessinsider", "caption": "Goldman Sachs has crowned its newest class of partners.\n\nThe storied financial institution announced it elevated 109 executives to one of Wall Street's most coveted titles — the largest class since 2010. Thursday's announcement continues the bank's tradition of selecting a group of leaders every two years, usually in early November.\n\nMaking partner at Goldman is a major career milestone. The title is paired with lucrative financial rewards, influence over the bank's direction, and one of Wall Street's most coveted titles. \n\nIt's also not easy. Making the cut requires years of hard work and achievements, along with an intense review process known internally as \"cross-ruffing,\" a nod to the card game bridge.\n\nSee a full list of the newest partners at the link in our bio.\n\nStory by Alice Tecotzky\n\n(Credit: Getty Images)", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 行业大事件背景 → 晋升含金量解析 → 独家筛选机制揭秘\n为什么火: 揭秘顶级金融机构高盛内部晋升机制，满足大众对金字塔尖职场的窥探欲。\n改编角度: 盘点并拆解互联网或自媒体大厂高管的晋升标准，输出普通人的职场进阶指南。", "my": "为什么有些人做自媒体，明明粉丝不多，却总能接到源源不断的合作，而你每天更新，播放量却卡在几百动也不动？\n\n其实不是你不够努力，而是你一开始就把自媒体当成了日记本，而不是一个有商业逻辑的产品。\n\n我见过太多新手，发视频全凭灵感。今天拍这个，明天拍那个，账号没有主线，观众点进来根本不知道你是谁、能帮他解决什么问题。这就像你去一家餐厅，菜单上什么都有，但招牌菜是什么你根本记不住。\n\n想要打破这个僵局，你需要做三步调整。\n\n第一步，砍掉那些自嗨的内容。只聊你的目标用户每天晚上睡不着觉在想什么痛点。\n\n第二步，建立你自己的内容标准。每一条视频都要有明确的价值输出，要么帮用户省时间，要么帮用户长见识。\n\n第三步，把你的选题固定在一个垂直领域，连续输出三十天，让平台和用户都清晰你的标签。\n\n自媒体从来不是靠运气爆发的行业，而是靠一套可复制的流程稳步前行的。如果你现在也觉得账号做得很迷茫，不妨在评论区聊聊你的困惑，我们一条条来梳理。", "tags": "", "bait": false, "type": "Carousel", "likes": 3613, "comments": 28, "er": 0.07, "followers": 5059484, "date": "2026-11-05", "url": "https://www.instagram.com/p/DfYIq40F9Z5/", "video": false, "ratio": 0, "score": 0.07, "status": "未处理", "x": 0.8}, {"id": "DfTAi1sEaSY", "tracker": "Chalette Demo 竞对", "competitor": "businessinsider", "caption": "He had less than two weeks of cash left. So why was this popcorn entrepreneur sending handwritten letters to major retailers and cold-messaging editors on LinkedIn?\n\nPopsmith cofounder Tal Moore and his cofounder had been burning through cash, struggling to sell their premium stovetop popcorn maker. With little room left to experiment, Moore started reaching out to some of the biggest names in retail and media.\n\nOne message would open a door he wasn't expecting.\n\nCorrespondent Kathleen Elkins breaks down how one unexpected connection changed the company's trajectory.\n\nRead more about how Moore took a chance on an unexpected opportunity at the link in our bio.\n\n#oprah #smallbusiness #entrepreneurship #popsmith #business", "transcript": "How did one entrepreneur go from having less than two weeks of cash left to repeatedly selling out of his popcorn popper? Tau Moore and his business partner spent two years and $3.5 million developing a premium stovetop popcorn maker. By early 2024, their company, Popsmith, was burning $100,000 a month and struggling to sell enough product. Moore sold $600,000 of his own stock to give the business another six months. The co-founders laid off employees, scale back agencies, and began looking for ways to market their product without spending heavily on ads. Moore said he needed to throw some Hail Marys. He sent poppers and handwritten notes to the CEOs of William Sonoma and Creighton Barrel. Within two months, both retailers had reached out. Then he cold messaged an editor at Oprah Daily on LinkedIn. That connection helped his popper win on Oprah's coveted favorite things list. After the list came out in 2024, Popsmith sold out of every popper within weeks, and then sold out three more times over the next five months. Moore says taking big swings and surviving what he calls the middle, the long difficult stretch between launching a company and seeing it succeed, is what made this small business work. Read more small business stories like this and subscribe to the Small Business Newsletter at Business Insider.", "brk": "Hook类型: 绝境求生与逆袭的悬念故事\n结构: 绝境危机 → 孤注一掷的冷启动行动 → 意外爆红与翻盘\n为什么火: 用极具戏剧性的“2周现金倒计时”和“逆袭入选奥普拉书单”抓住了观众对商业奇迹的好奇心。\n改编角度: 结合自媒体创业案例，复盘如何用“冷私信与手写信”低成本撬动大平台曝光。", "my": "账上只剩两周的钱，仓库里压着卖不出去的产品，每个月还要白白烧掉十万块，这时候你会怎么办？\n\n我见过很多做自媒体的朋友，遇到流量瓶颈或者产品卖不动的时候，第一反应就是疯狂投流，结果钱花光了水花都没有。但有一个做内容创业的团队，在账目见底的时候，反倒停掉了所有广告预算。\n\n他们做了两件事。第一，创始人亲手写了信，连同自己的产品一起寄给行业里几个头部大号的负责人。第二，他去翻领英，给垂直媒体的编辑发私信。没有套话，就是真诚地介绍自己的产品和做内容的初衷。\n\n两个月后，其中一个大号联系了他，后来直接把他的产品放进了当年的年度好物推荐榜单里。榜单发布的几周内，他们的库存全部卖空，接下来几个月连续补货四次。\n\n很多人以为爆款是靠运气，但真正能撑过从发布到起量这段最难熬日子的，往往不是砸钱最多的人，而是敢于在没路走的时候，把产品和真诚直接送到对方面前的人。\n\n如果你现在做内容也正处在不上不下的瓶颈期，不妨停下来看看手里最扎实的东西是什么。关注我，我们聊聊怎么把真实的内容做好。", "tags": "oprah, smallbusiness, entrepreneurship, popsmith, business", "bait": false, "type": "Video", "likes": 3152, "comments": 53, "er": 0.06, "followers": 5059484, "date": "2026-11-03", "url": "https://www.instagram.com/p/DfTAi1sEaSY/", "video": true, "ratio": 0, "score": 0.07, "status": "未处理", "x": 0.8}, {"id": "De-CXqFl1Ey", "tracker": "Chalette Demo 竞对", "competitor": "businessinsider", "caption": "Skydance wants employees back in the office five days a week — and staffers who aren't willing to comply may be eligible for a buyout.\n\nCEO David Ellison and co-CEO Ynon Kreiz informed employees at the media giant about the change on Monday afternoon. They said in a memo that the RTO order applied \"across all of Skydance.\"\n\n\"We truly believe this is in the best interest of our company and our people,\" Ellison and Kreiz wrote in a memo to employees, which was viewed by Business Insider.\n\nThe memo did not mention whether there were any exceptions or say who's eligible for a buyout. It said employees who qualify for a buyout would get an \"individual communication with their personalized details and terms, and a window to decide whether to accept this one-time offer.\"\n\nRead the full memo from Ellison and Kreiz at the link in our bio. \n\nStory by James Faris\n\n(Credit: NYSE)", "transcript": "", "brk": "Hook类型: 行业内幕/痛点直击\n结构: 交代大厂强制返岗背景 → 给出不愿配合可拿买断费的政策 → 引导查看详情\n为什么火: 戳中打工人对“强制返岗”的敏感神经，且“提供买断方案”带来反常识的新鲜感\n改编角度: 结合自媒体行业现状，聊聊远程办公泡沫破裂与搞钱生存法则", "my": "为什么现在很多做自媒体的人明明每天都在发视频，播放量却卡在几百动也不动？\n\n我最近翻了十几个粉丝从几千做到几十万的账号，发现他们根本不是运气好，而是踩中了一个非常关键的动作。他们每天花在写开头和挑话题上的时间，占了整个创作过程的一半以上。\n\n具体怎么做呢。第一步，你得放弃那种自嗨式的选题，去看看你同行最近一周点赞最高的那三条视频聊的是什么。第二步，把那些评论区讨论最激烈的问题记下来，那才是大家真正关心的痛点。第三步，把你的个人经历或者踩过的坑放进开头的前三秒里，用真诚的语气直接说出来。\n\n你不用去模仿那些大博主的夸张动作，只要把自己的真实经验一步步拆解开来就行。今天你可以先去复盘一下你账号里播放量最高的那条视频，看看它到底满足了观众的什么需求。", "tags": "", "bait": false, "type": "Image", "likes": 2229, "comments": 372, "er": 0.05, "followers": 5057938, "date": "2026-10-26", "url": "https://www.instagram.com/p/De-CXqFl1Ey/", "video": false, "ratio": 0, "score": 0.07, "status": "未处理", "x": 0.8}, {"id": "DfSsPWsBJzz", "tracker": "Chalette Demo 竞对", "competitor": "airbnb", "caption": "A story inspired by a real guest review, visualized by food artist @sibatable. Ladybugs: magical or absolutely not?", "transcript": "Once upon a cozy mountain cabin, a newlywed couple will call. The fams encountered some guests. In this picturesque countryside escape set against the dramatic backdrop of the smoky mountains, Mr. Fam came to unplug with his newlywed wife, Mrs. Fam, and they were about to encounter a whimsical surprise. Hundreds. No. Thousands. Of ladybugs. Gluttering about like little fairies right outside their cabin. Mr. Fam said to his wife, Wow, this is magical. Look at all these ladybugs. Just then, Mrs. Fam ran inside, dramatically flinging the door op acon\" for other startup founders learning how to bootstrap their own businesses.\n\nRobinson leaves behind a career that carried him from the halls of Wall Street during the 2008 financial crisis to serial entrepreneurship in Austin's post-2020 tech wave. In recent years, he had relocated to Aspen, Colorado, and crystallized an ideology that runs counter to Silicon Valley's VC-friendly ethos.\n\nRead more about Robinson’s", "transcript": "", "brk": "Hook类型: 悲剧讣告/痛点直击\n结构: 创始人离世悲剧 → 商业成就回顾 → 行业精神传承\n为什么火: 用英年早逝的悲剧性事件叠加精英成功人设，激发了读者的同理心与唏嘘感。\n改编角度: 盘点商业大佬的传奇人生与反主流价值观，切入创业者精神共鸣。", "my": "很多人觉得做自媒体就是闷头剪辑和发作品，只要量够大就一定能拿到结果。但其实你可能走错了方向。\n\n我之前认识一个做科技类账号的博主，他做内容非常克制，从来不追那些全网都在讨论的热点。他把所有的精力都放在打磨每一个选题的切入点上，研究用户的真实评论，把复杂的行业趋势拆解成普通人能听懂的大白话。\n\n他做了三年，粉丝量虽然不算全网顶流，但他的账号粘性非常高，每一条视频的完播率和互动率都远超同行的平均水平。\n\n这给我们的启示是什么？做自媒体千万不要盲目跟风去卷数量。你要去思考，你的内容到底帮用户解决了什么具体的问题。\n\n如果你现在也陷入了更新很多却没有流量的困境，不妨停下来，把最近爆火的同行视频拿出来看看，分析一下他们的结构是怎么搭的。\n\n如果你想知道具体怎么拆解同行的爆款内容，可以在评论区留言，我们下期详细聊。", "tags": "", "bait": false, "type": "Carousel", "likes": 3506, "comments": 69, "er": 0.07, "followers": 5059484, "date": "2026-11-03", "url": "https://www.instagram.com/p/DfS9cJ3l7Gb/", "video": false, "ratio": 0, "score": 0.07, "status": "未处理", "x": 0.8}, {"id": "DfQfZW5F-i6", "tracker": "Chalette Demo 竞对", "competitor": "businessinsider", "caption": "America has a classic salary milestone: six figures a year. Anthropic's average employee has cost their employer that much every month.\n\nAnthropic's personnel expenses topped $1.7 billion for its 5,300 workers from July through September, according to an amended S-1 filing the AI company released Monday morning ahead of its initial public offering later this month. That means the expenses averaged over $322,000 per worker over the three-month span.\n\nThe total indicates how a seat inside Anthropic became one of the 21st century's quickest pathways to extraordinary wealth. Its coming IPO will mint a new cohort of multimillionaires. Even employees who've only been around for ctually reveal about the AI company? Executive editor Joe Ciolli picks six figures that help tell the story.\n\n#Anthropic #AI #IPO #stockmarket #tech", "transcript": "Anthropic released its IPO prospectus on Monday and it was filled with eye-popping figures. We've gone through and picked the sixth that best tells the story of Anthropic. Here they are, presented in decreasing order. $30 trillion. This is Anthropics' reported total addressable market. That means it's future theoretical revenue opportunity. At that level, it would exceed SpaceX. $2 trillion. That's the reported upper end of the valuation range Anthropic could seek. This is still a fluid figure and it could change at any time, but if it pans out, it would be the biggest of all time. $100 billion. That's the reported top end of Anthropic's total potential deal size. If the offer reaches that level, it would become the biggest ever, exceeding SpaceX's $75 billion in proceeds. $16.3 billion. That's the company's revenue they reported for the first half of 2026. That's up majorly from $1.2 billion a year before. $94 billion. That's the number of pages in the Anthropic S1 dedicated to risk factors. That's almost a quarter of the entire document. And let me tell you, there are some wild nuggets buried in there. Finally, two. That's the number of primary competitors that Anthropics does it has. They would be Alphabet and OpenAI. So there you have it, Anthropic by the Numbers. Stay tuned for more updates on actual pricing details. I'm Joe Scioli. Follow my work on Business Insider and subscribe to my newsletter, First Trade.", "brk": "Hook类型: 数字承诺\n结构: 抛出IPO背景 → 盘点6个关键震撼数字 → 总结并引导关注\n为什么火: 用极具冲击力的商业巨额数字和倒序悬念，快速建立认知高差\n改编角度: 盘点你所在行业的头部IP最新财报或大动作，用核心数据讲故事", "my": "很多人做自媒体总觉得粉丝不够看播放量焦虑，其实是你压根没看懂后台给你的这六个底层数据。我花了一整周时间把账号所有爆款拆开，找出了真正能决定你能不能赚到钱的六个核心指标，我们从后往前说。第一个是收藏转发比，这个数字直接决定了你的内容有没有深度价值，如果只有点赞没有收藏，说明你的视频看完就忘，平台根本不会给你推第二个流量池。第二个是完播率，这不仅看前三秒的钩子，更考验你中间节奏有没有注水，只要观众在某一个节点划走，系统立马就会判定你内容质量不行。第三个是粉丝转化率，不是看你总粉丝量涨了多少，而是看每一个来看你视频的人里有多少愿意点下关注，这代表你的人设能不能立得住。第四个是人均观看时长，这个数据藏在后台最深处，它直接反映出你的选题到底能不能抓住痛点。第五个是评论区互动率，不是让你去回复表情符号，而是看有没有人愿意在下面留下长篇大论的讨论。最后第六个，也是最核心的一个，就是你的发布频率和垂直度。很多账号今天发搞笑明天发职场，数据不崩才怪。把这六个数据拉出来对照一遍，你现在的账号到底卡在哪一步，心里大概就有数了。如果你也想把自己的自媒体内容真正做出成效，可以点个关注，我们评论区接着聊。", "tags": "Anthropic, AI, IPO, stockmarket, tech", "bait": false, "type": "Video", "likes": 2455, "comments": 27, "er": 0.05, "followers": 5057973, "date": "2026-10-26", "url": "https://www.instagram.com/p/De-TfF2gnml/", "video": true, "ratio": 0, "score": 0.05, "status": "未处理", "x": 0.6}, {"id": "DfVe8Z_DLtl", "tracker": "Chalette Demo 竞对", "competitor": "businessinsider", "caption": "Elon Musk spent more than $400 million trying to shape the 2026 midterms. Nearly half of that money went toward a single Senate race in Texas. But did it make a difference?\n\nThe election results revealed just how much voters were thinking about everyday expenses. And in several states, opposition to AI data centers became a major campaign issue.\n\nExecutive editor Dan DeFrancesco breaks down the biggest winners and losers of election night — and the voter concerns that helped shape the results.\n\nRead more about the biggest winners and losers of the 2026 midterms at the link in our bio.\n\n#midterms #election2026 #elonmusk #politics #datacenters", "transcript": "Alright, election day is in the books, so let's break down the biggest winners and losers from last night's midterms. We'll start off with our first loser, the man who spent the most money trying to shape the outcome. Elon Musk dropped more than $400 million on this election, the most any non-Canada has ever spent in a single cycle. His biggest bet was Ken Paxton's Texas Senate race, where he put in roughly $212 million. Paxton lost, and Texas turned blue. Not a great return. On the winning side, anyone who made the cost of living their message, exit polls show 88% of voters were concerned about grocery prices and 59% were very concerned about gas costs. The economy was the top issue of the night, and candidates who stayed on that message had a good one. AI lost big last night. 56% of voters said AI and data centers were a crucial or major factor in their vote, and Democrats flipped seats in Ohio, Pennsylvania, and Wisconsin by running against data center development. Senate Republicans had already warned AI companies, if candidates go down and data centers get the blame, politicians across the country will take notice. And the biggest winner of the night, Democrats. They flipped control of both chambers. If you were counting on those $5,000 checks Trump promised if Republicans won, well, don't. For the full breakdown of winners and losers from the 2026 midterms, head to Business Insider.", "brk": "Hook类型: 悬念+数字承诺\n结构: 失败者复盘(马斯克) → 关键议题分析(通胀与AI) → 最终赢家揭晓\n为什么火: 用巨额资金打水漂的反转和大众关心的经济痛点制造了强烈的猎奇与共鸣感。\n改编角度: 盘点你所在垂直领域里大佬“砸钱翻车”或“踩中风口”的真实案例。", "my": "为什么有的人天天发视频数据很好，你辛辛苦苦剪辑到半夜却只有十几个播放量。今天我们来复盘两个典型的账号，看看差距到底在哪里。先看第一个失败的案例，有个博主为了追热点，花了两万块钱去买流量投千川，结果账号不仅没有起色，反而被系统限流了，可以说是血本无归。为什么会这样，因为他完全忽略了平台的底层逻辑，盲目砸钱买曝光，内容本身没有留存率，投再多钱也是白搭。再看那些真正跑出来的账号，他们赢在哪里，赢在抓住了用户的真实痛点。数据表明，百分之九十的观众点进来，最关心的其实是这个视频到底能不能帮我解决实际问题。那些天天讲大道理的账号反而没人看，只有把内容拆解成具体的步骤，教大家怎么写标题怎么做选题，播放量才能稳步上升。最后看最聪明的这批创作者，他们已经开始用人工智能来辅助日常创作了，但不是盲目抄袭，而是用工具来提升效率。如果你现在做账号也遇到了瓶颈，不知道下一步该怎么走，可以先停下来复盘一下你的前三秒钩子有没有抓人。", "tags": "midterms, election2026, elonmusk, politics, datacenters", "bait": false, "type": "Video", "likes": 2524, "comments": 40, "er": 0.05, "followers": 5059484, "date": "2026-11-04", "url": "https://www.instagram.com/p/DfVe8Z_DLtl/", "video": true, "ratio": 0, "score": 0.05, "status": "未处理", "x": 0.6}, {"id": "DdPLCRDCFbb", "tracker": "Chalette Demo 竞对", "competitor": "canva", "caption": "The one where the city served looks. 😉 \n\n#NYFW #Canva", "transcript": "Oh", "brk": "Hook类型: 视觉震撼/情绪共鸣\n结构: 城市地标与视觉设计融合 → 创意成品展示 → 品牌关联收尾\n为什么火: 紧跟纽约时装周热点，画面高级且完美契合品牌调性，引发美学共鸣。\n改编角度: 结合你所在城市的标志性场景，用自媒体工具快速做出一组惊艳的视觉海报。", "my": "你是不是也经常这样，看到别人发出来的内容特别有高级感，画面干净，文案戳人，再看看自己的，怎么看都觉得哪里不对劲，排版乱糟糟的，一点吸引力都没有。其实问题不在于你没有审美，而是你缺
